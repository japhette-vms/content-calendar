  }
  $('#app').innerHTML=head(`<select id="cs" style="width:auto" aria-label="Client">${clients.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button id="allb">All clients</button><button id="vwb">Week view</button><button id="rpb">Report</button><button id="yrb">Year</button><button id="icb">Calendar file</button><button id="st">Settings</button><button class="p" id="np">New post</button>`)+
  `<main><div class="row"><button id="pm" aria-label="Previous month">‹</button><h2 style="margin:0;flex:1;text-align:center">${month.toLocaleString('en',{month:'long',year:'numeric'})}</h2><button id="nm" aria-label="Next month">›</button></div>

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('Could not load the Excel reader. Check your internet connection.'));document.head.appendChild(sc);});}
const XMAP={'date':'post_date','time (client)':'post_time','platform':'platform','content pillar':'pillar','format':'format','campaign / promo':'campaign','post copy / caption':'caption','visual / photo (link or status)':'visual','hashtags / tags (pick a set or type)':'hashtags','status':'status','client approval':'approval','assets ready?':'assets_ready','live link':'live_link','notes':'notes','reach':'reach','likes':'likes','comments':'comments_count','shares / saves':'shares_saves','dms / inquiries':'dms_inquiries','link clicks':'link_clicks','engagements':'engagements','asset due date':'asset_due_date','location(s)':'locations','content type':'content_type','approved by':'approved_by','approved on':'approved_on','repost?':'repost','cta (call to action)':'cta','tracking link (utm)':'tracking_url'};
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const name=wb.SheetNames.includes('Posts')?'Posts':wb.SheetNames.find(n=>/post/i.test(n));
  if(!name) throw new Error('No "Posts" sheet found in this file.');
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
  const hi=rows.findIndex(r=>{const t=r.map(x=>String(x??'').trim().toLowerCase());return t.includes('date')&&t.includes('platform');});
  if(hi<0) throw new Error('Could not find the header row (Date, Platform...) in the Posts sheet.');
  const RULES=[[/^time\b/,'post_time'],[/^hashtags/,'hashtags'],[/^visual/,'visual'],[/^post copy|^caption/,'caption'],[/^campaign/,'campaign'],[/^location/,'locations'],[/^cta/,'cta'],[/^tracking/,'tracking_url'],[/^content pillar|^pillar/,'pillar'],[/^client approval|^approval/,'approval']];
  const mapH=x=>{const t=String(x??'').trim().toLowerCase();if(XMAP[t])return XMAP[t];const r=RULES.find(q=>q[0].test(t));return r?r[1]:null;};
  const hdr=rows[hi].map(mapH);
  const txt=v=>{if(v==null||v==='')return null;const t=String(v).trim();return (!t||/^none$/i.test(t))?null:t;};

  <span style="color:var(--mute)">${esc(p.platform)} · ${esc(when)}${p.post_time?' at '+esc(p.post_time.slice(0,5)):''}</span></div>
  ${postCard(p)}
  ${p.post_date&&p.status!=='Posted'?`<p style="text-align:center;color:var(--mute);margin:0 0 8px">Goes live ${esc(rel(p.post_date))} · ${esc(when)}${p.post_time?' at '+esc(p.post_time.slice(0,5)):''}</p>`:''}
  <div class="row stickybar"><button class="p big" id="ap">Approve</button><button class="bad big" id="rc">Request changes</button></div>
  <p style="color:var(--mute)"><span class="badge" style="background:${PILLARS[p.pillar]||'#6b6f85'};color:${ink(PILLARS[p.pillar])}">${esc(p.pillar)}</span> ${esc(p.format)} ${p.hashtags?'· '+esc(p.hashtags):''}</p>
  <div id="cmx" style="margin-top:14px"></div></div>`;
  $('#lv').onclick=()=>{lv=true;clientView();};$('#cvb').onclick=()=>{lv='cal';clientView();};$('#fvb').onclick=()=>{lv='feed';clientView();};

  m.ontouchend=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<70)return;if(dx<0&&idx<posts.length-1){idx++;clientView();}else if(dx>0&&idx>0){idx--;clientView();}};

  $('#ap').onclick=()=>act('Approved');
  $('#rc').onclick=()=>{const d=$('#dlg');
    d.innerHTML=`<form id="rf"><h2 style="margin-top:0">What would you like changed?</h2><div role="group" aria-label="What to change">${['Wording','Photo or video','Date or time','Something else'].map(r=>`<label class="rch"><input type="checkbox" name="r" value="${r}" style="width:auto;min-height:0"> ${r}</label>`).join('')}</div><label for="rn">Add a note (optional)</label><textarea id="rn" rows="3" placeholder="For example: please mention our Saturday hours"></textarea><div class="row" style="margin-top:12px"><button class="bad">Send to my social media manager</button><button type="button" id="rx">Cancel</button></div></form>`;
    d.showModal();$('#rx').onclick=()=>d.close();
    $('#rf').onsubmit=async e=>{e.preventDefault();const rs=[...d.querySelectorAll('[name=r]:checked')].map(x=>x.value),n=$('#rn').value.trim(),body=(rs.length?'['+rs.join(', ')+'] ':'')+n;
      if(body){const w=await sb.from('comments').insert({post_id:p.id,author_id:user.id,body});if(w.error)alert('Could not add your note: '+w.error.message);}
      d.close();act('Changes requested');};};
  showComments(p.id,'#cmx');
}
async function boot(){
  $('#app').innerHTML='<div role="status" aria-label="Loading your calendar" style="padding:20px"><div class="sk" style="height:56px"></div><div class="sk" style="height:18px;width:60%"></div><div class="sk" style="height:320px"></div><div class="sk" style="height:54px"></div></div>';
  try{await boot0();}
  catch(e){$('#app').innerHTML='<div class="login"><h1 style="margin-top:0">Can\u2019t connect</h1><p>Check your internet connection and try again.</p><button class="p" id="rt" style="width:100%">Try again</button></div>';$('#rt').onclick=boot;}
}
boot().then(()=>{if(INVITED&&me){history.replaceState(null,'',location.pathname);pwForm(true);}});
</script>
</body>
