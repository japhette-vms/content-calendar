<script>
(function(){
'use strict';
const Q=s=>document.querySelector(s);
const isCli=()=>typeof me!=='undefined'&&me&&me.role!=='admin';

/* ---------- "changed since you last looked" (stored in this browser only) ----------
   For each post we remember what the client last saw. Opening a post marks it as seen. */
const hs=s=>{s=String(s||'');let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);};
const fp=p=>({c:hs(p.caption),v:hs(p.visual),d:p.post_date||'',t:(p.post_time||'').slice(0,5),h:hs(p.hashtags)});
const LAB={c:'wording',v:'photo or video',d:'date or time',t:'date or time',h:'hashtags'};
let CH=new Map(),store=null,skey='',viewing=null;
const load=()=>{try{return JSON.parse(localStorage.getItem(skey)||'null');}catch(e){return null;}};
const save=()=>{try{localStorage.setItem(skey,JSON.stringify(store));}catch(e){}};
function compute(){
  if(!isCli()||!user||!cid)return;
  skey='cc_seen:'+user.id+':'+cid;
  let m=load();
  if(!m){m={};posts.forEach(p=>{m[p.id]=fp(p);});store=m;save();CH=new Map();return;}   // first visit: nothing counts as changed
  store=m;CH=new Map();
  posts.forEach(p=>{const o=m[p.id];if(!o){CH.set(p.id,['new']);return;}
    const n=fp(p),l=[...new Set(Object.keys(LAB).filter(k=>o[k]!==n[k]).map(k=>LAB[k]))];
    if(l.length)CH.set(p.id,l);});}
function commit(id){const p=posts.find(x=>x.id===id);if(p&&store){store[id]=fp(p);save();}CH.delete(id);}
const _lp=window.loadPosts;
window.loadPosts=async function(){const r=await _lp.apply(this,arguments);try{compute();}catch(e){console.error('chg',e);}return r;};
const tag=p=>{const l=CH.get(p.id);return l?`<span class="sb upd">${l[0]==='new'?'New':'Updated'}</span>`:'';};
window.ccTag=tag;
addEventListener('pagehide',()=>{if(viewing){commit(viewing);viewing=null;}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&viewing){commit(viewing);viewing=null;}});

function chgRun(){
  if(!isCli())return;
  if(viewing&&(lv!==false||!posts[idx]||posts[idx].id!==viewing)){commit(viewing);viewing=null;}
  /* post screen: say what changed */
  const c=Q('#cm>.card');
  if(lv===false&&posts[idx]){const p=posts[idx],l=CH.get(p.id);
    if(l){viewing=p.id;
      if(c&&!c.querySelector('.upn')){const r=c.querySelector(':scope>.row');
        if(r)r.insertAdjacentHTML('afterend',`<div class="upn" role="status">${l[0]==='new'?'\u{1F195} This post is new since you last looked.':'\u270E Updated since you last looked: '+l.join(', ')+'.'}</div>`);}}}
  /* list view */
  document.querySelectorAll('#cm button.card[data-i]:not([data-chg])').forEach(b=>{b.dataset.chg='1';const p=posts[+b.dataset.i],t=p&&tag(p),f=b.querySelector('.row b');if(t&&f)f.insertAdjacentHTML('afterend',t);});
  /* calendar */
  document.querySelectorAll('.cgrid .day[data-ds]:not([data-chg])').forEach(d=>{d.dataset.chg='1';
    const ps=posts.filter(p=>p.post_date===d.dataset.ds&&CH.has(p.id));if(!ps.length)return;
    d.classList.add('hasupd');
    d.querySelectorAll('.cc[data-i]').forEach(ch=>{const p=posts[+ch.dataset.i];if(p&&CH.has(p.id)){const a=ch.querySelector('.cl1');if(a)a.insertAdjacentHTML('beforeend','<i class="updd" title="Changed since you last looked"></i>');}});});
  const lg=Q('#dl5');if(lg&&CH.size&&!lg.querySelector('.updd'))lg.insertAdjacentHTML('beforeend','<span><i class="updd" style="margin:0 4px 0 0"></i>changed since you looked</span>');
  /* summary strip */
  const tb=Q('#topb');
  if(tb&&lv!=='ideas'&&lv!=='week'&&lv!==false&&CH.size&&!tb.querySelector('.updb')){
    const ids=[...CH.keys()].map(id=>posts.find(x=>x.id===id)).filter(Boolean).sort((a,b)=>(a.post_date||'9999').localeCompare(b.post_date||'9999'));
    if(ids.length){tb.insertAdjacentHTML('beforeend',`<div class="updb" role="status"><span>\u270E ${ids.length} post${ids.length===1?' was':'s were'} new or changed since you last looked.</span><button type="button" id="updgo">Show me</button></div>`);
      Q('#updgo').onclick=()=>{lv=false;idx=posts.indexOf(ids[0]);clientView();scrollTo(0,0);};}}}

/* ---------- This week + Add to my calendar buttons (desktop; phones use the bottom tabs) ---------- */
function btnRun(){
  if(!isCli())return;
  const r=Q('#cm>.row:first-child');
  if(!r||(!Q('#one')&&!Q('#lv')))return;
  if(lv!=='week'&&!Q('#wkb')){const b=document.createElement('button');b.type='button';b.id='wkb';b.textContent='This week';b.onclick=()=>{lv='week';clientView();scrollTo(0,0);};r.appendChild(b);}
  if((lv==='cal'||lv==='week')&&!Q('#icsb')){const b=document.createElement('button');b.type='button';b.id='icsb';b.textContent='\u{1F4C5} Add to my calendar';b.onclick=icsDialog;r.appendChild(b);}}

let raf=0;
function enh(){try{chgRun();btnRun();}catch(e){console.error('ui10',e);}}
new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(enh);}).observe(Q('#app'),{childList:true,subtree:true});
enh();
})();
</script>

<style>.vth{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.vp{position:relative;display:block;border-radius:10px;overflow:hidden;background:var(--bg)}.vp img{display:block;max-width:100%;max-height:180px;object-fit:cover}.vp::after{content:'\25B6';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;background:rgba(0,0,0,.28)}</style>
<script>
/* Add-ons: Needs attention, Remind client, direct post links, Suggest wording, Approve with a small fix, badge count. No database changes. */
(function(){
'use strict';
const Q=s=>document.querySelector(s),dl=()=>Q('#dlg');
const fail=e=>console.error('addons',e);
const isA=()=>me&&me.role==='admin';
const link=id=>location.origin+location.pathname+'#post='+encodeURIComponent(id);
const day=d=>d?Math.round((new Date(d+'T00:00')-new Date(iso(new Date())+'T00:00'))/864e5):null;
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('en',{weekday:'long',month:'short',day:'numeric'});
const open=(h)=>{const d=dl();d.innerHTML=h+'<div class="row" style="margin-top:14px"><button type="button" id="axc">Close</button></div>';if(!d.open)d.showModal();Q('#axc').onclick=()=>d.close();return d;};

/* 1. Needs attention (all clients) */
async function attention(){
  open('<p>Loading…</p>');
  try{
    const [P,C,I]=await Promise.all([fetchAll('posts','id,client_id,post_date,post_time,platform,approval,status,due_date'),
      sb.from('comments').select('id,post_id,body,created_at').eq('resolved',false).neq('author_id',user.id),
      sb.from('ideas').select('id,client_id,notes').eq('source','client').eq('status','Idea')]);
    const cn=id=>((clients.find(c=>c.id===id)||{}).name||'Client'),byId=new Map(P.map(p=>[p.id,p])),open_=P.filter(p=>p.status!=='Posted');
    const post=p=>({cl:cn(p.client_id),t:(p.platform||'')+' · '+(p.post_date?fmt(p.post_date):'No date'),go:()=>goPost(p)});
    const S=[
      ['Changes requested',open_.filter(p=>p.approval==='Changes requested').map(post)],
      ['Unresolved comments',C.data?C.data.filter(c=>byId.has(c.post_id)).map(c=>{const p=byId.get(c.post_id);return {...post(p),t:'“'+String(c.body).slice(0,70)+'” · '+(p.post_date?fmt(p.post_date):'')};}):[]],
      ['New ideas',(I.data||[]).map(i=>({cl:cn(i.client_id),t:String(i.notes||'').replace(/^\[[^\]]*\]\n?/,'').slice(0,80)||'New idea',go:()=>goIdeas(i.client_id)}))],
      ['Approvals overdue',open_.filter(p=>p.approval==='Pending'&&p.due_date&&day(p.due_date)<0).map(post)],
      ['Going live in 3 days, not approved',open_.filter(p=>p.approval!=='Approved'&&p.post_date&&day(p.post_date)>=0&&day(p.post_date)<=3).map(post)]];
    const tot=S.reduce((n,s)=>n+s[1].length,0),fns=[];
    open(`<h2 style="margin-top:0">Needs your attention</h2>${tot?'':'<p>Nothing is waiting. You are all caught up.</p>'}`+S.filter(s=>s[1].length).map(s=>`<h3 style="margin:14px 0 4px">${s[0]} (${s[1].length})</h3>`+s[1].map(it=>{fns.push(it.go);return `<button type="button" class="axg" data-i="${fns.length-1}" style="display:block;width:100%;text-align:left;margin:4px 0"><b>${esc(it.cl)}</b><br><small>${esc(it.t)}</small></button>`;}).join('')).join(''));
    document.querySelectorAll('.axg').forEach(b=>b.onclick=()=>{dl().close();fns[+b.dataset.i]();});
  }catch(e){fail(e);open('<p>Could not load: '+esc(e.message||e)+'</p>');}
}
async function switchTo(id){if(cid!==id){cid=id;const s=Q('#cs');if(s)s.value=id;await loadPosts();adminView();}}
async function goPost(p){await switchTo(p.client_id);const f=posts.find(x=>x.id===p.id);if(f)postForm(f);}
async function goIdeas(id){await switchTo(id);try{ideasForm();}catch(e){fail(e);}}

/* 2. Remind client */
function remind(){
  const pend=posts.filter(p=>p.approval==='Pending'&&p.status!=='Posted');
  if(!pend.length)return toast('Nothing is waiting for this client.');
  const first=pend.find(p=>p.post_date)||pend[0],n=pend.length,nm=((clients.find(c=>c.id===cid)||{}).name||'').trim();
  const msg=`Hi${nm?' '+nm:''}! ${n} post${n===1?' needs':'s need'} your approval${first.post_date?', the first by '+new Date(first.post_date+'T00:00').toLocaleDateString('en',{weekday:'long'}):''}. It takes a minute: ${link(first.id)}`;
  const e=encodeURIComponent(msg);
  open(`<h2 style="margin-top:0">Remind client</h2><textarea id="axm" rows="5">${esc(msg)}</textarea><div class="row" style="margin-top:10px">${navigator.share?'<button class="p" type="button" id="axs">Share…</button>':''}<a href="https://wa.me/?text=${e}" target="_blank" rel="noopener"><button type="button">WhatsApp</button></a><a href="mailto:?subject=${encodeURIComponent('Posts waiting for your approval')}&body=${e}"><button type="button">Email</button></a><button type="button" id="axy">Copy</button></div><p style="font-size:13px;color:var(--mute)">Messenger: use Share… and pick it.</p>`);
  const cur=()=>Q('#axm').value;
  if(Q('#axs'))Q('#axs').onclick=()=>navigator.share({text:cur()}).catch(()=>{});
  Q('#axy').onclick=()=>navigator.clipboard.writeText(cur()).then(()=>toast('Copied'),()=>toast('Could not copy'));
  Q('#axm').oninput=()=>{const v=encodeURIComponent(cur());document.querySelectorAll('#dlg a').forEach(a=>{a.href=a.href.replace(/(text=|body=)[^&]*/,'$1'+v);});};
}

/* 7 + 4. Approve with a small fix / Suggest wording (client) */
async function finish(p,approve,body,back){
  if(approve){const r=await sb.rpc('set_approval',{p_post:p.id,p_approval:'Approved'});if(r.error)return alert('Could not save: '+r.error.message);}
  const w=await sb.from('comments').insert({post_id:p.id,author_id:user.id,body});if(w.error)alert('Could not save the note: '+w.error.message);
  await loadPosts();const n=posts.length;if(approve)for(let o=1;o<=n;o++){const j=(back+o)%n;if(posts[j].approval==='Pending'){idx=j;break;}}
  clientView();toast(approve?'Approved with your note':'Suggestion sent');
}
function smallFix(){const p=posts[idx],back=idx;
  const d=open(`<h2 style="margin-top:0">Approve with a small fix</h2><p style="color:var(--mute)">The post is approved. Tell us the tweak and we will make it.</p><textarea id="axt" rows="3" placeholder="For example: please fix the typo in line 2"></textarea><div class="row" style="margin-top:10px"><button class="ok" type="button" id="axg">Approve and send note</button></div>`);
  Q('#axg').onclick=()=>{const t=Q('#axt').value.trim();if(!t)return Q('#axt').focus();d.close();finish(p,true,'Approved with a small fix: '+t,back);};}
function suggest(){const p=posts[idx],back=idx;
  const d=open(`<h2 style="margin-top:0">Suggest wording</h2><label>Current</label><div class="card" style="white-space:pre-wrap">${esc(p.caption||'')}</div><label for="axw">Your version</label><textarea id="axw" rows="6">${esc(p.caption||'')}</textarea><div class="row" style="margin-top:10px"><button class="p" type="button" id="axg">Send suggestion</button></div>`);
  Q('#axg').onclick=()=>{const t=Q('#axw').value.trim();if(!t||t===(p.caption||'').trim())return toast('Change the wording first.');d.close();finish(p,false,'Suggested wording: '+t,back);};}

/* 4 (admin side). Use this wording */
function useBtns(){
  const ctx=window.__cmCtx;if(!isA()||!ctx)return;
  document.querySelectorAll('.cm[data-cid]').forEach(el=>{const b=el.querySelector('.cbody');
    if(!b||el.dataset.ax||!/^Suggested wording:/.test(b.textContent))return;el.dataset.ax='1';
    const btn=document.createElement('button');btn.type='button';btn.textContent='Use this wording';btn.className='p';btn.style.cssText='min-height:0;padding:2px 10px;font-size:12px;margin-left:8px';
    btn.onclick=async()=>{const cap=b.textContent.replace(/^Suggested wording:\s*/,'');
      const r=await sb.from('posts').update({caption:cap}).eq('id',ctx.pid);if(r.error)return alert('Could not update: '+r.error.message);
      await sb.from('comments').update({resolved:true}).eq('id',el.dataset.cid);
      await loadPosts();toast('Caption updated. Reopen the post to see it.');showComments(ctx.pid,ctx.sel,true);};
    el.appendChild(btn);});
}

/* 3. Direct links + 11. badge + wiring */
let linked=false;
function run(){
  if(!me)return;
  if(isA()){const h=Q('header');
    if(h&&!Q('#axa')){const t=Q('#tl'),mk=(id,tx,fn)=>{const b=document.createElement('button');b.id=id;b.type='button';b.textContent=tx;b.onclick=fn;h.insertBefore(b,t||Q('#out'));};
      mk('axa','Needs attention',attention);mk('axr','Remind client',remind);}
    useBtns();return;}
  if(!linked&&posts.length){linked=true;const m=location.hash.match(/post=([^&]+)/);
    if(m){const i=posts.findIndex(p=>String(p.id)===decodeURIComponent(m[1]));if(i>=0){lv=false;idx=i;clientView();return;}}}
  const ap=Q('#ap');
  if(ap&&!Q('#axf')){const f=document.createElement('button'),s=document.createElement('button');
    f.id='axf';f.type='button';f.className='big';f.textContent='Approve with a small fix';f.onclick=smallFix;
    s.id='axw2';s.type='button';s.className='big';s.textContent='Suggest wording';s.onclick=suggest;
    ap.parentNode.appendChild(f);ap.parentNode.appendChild(s);}
  try{if(navigator.setAppBadge){const n=posts.filter(p=>p.approval==='Pending'&&p.status!=='Posted').length;n?navigator.setAppBadge(n):navigator.clearAppBadge();}}catch(e){}
}
let raf=0;
new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{run();}catch(e){fail(e);}});}).observe(Q('#app'),{childList:true,subtree:true});
})();
</script>

<script>
/* Add-ons 2: More tools (Repeating posts, Campaigns, Client speed), swipe to decide, video timestamps, offline snapshot. */
(function(){
'use strict';
const Q=s=>document.querySelector(s),isA=()=>me&&me.role==='admin',fail=e=>console.error('addons2',e);
const open=h=>{const d=Q('#dlg');d.innerHTML=h+'<div class="row" style="margin-top:14px"><button type="button" id="bxc">Close</button></div>';if(!d.open)d.showModal();Q('#bxc').onclick=()=>d.close();return d;};
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');

function menu(){open('<h2 style="margin-top:0">More tools</h2><div class="row"><button id="bm1">Repeating posts</button><button id="bm2">Campaigns</button><button id="bm3">Client speed</button></div>');
  Q('#bm1').onclick=repeat;Q('#bm2').onclick=camps;Q('#bm3').onclick=speed;}

/* 8. Repeating posts */
function repeat(){const n=new Date(),ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'),W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  open(`<h2 style="margin-top:0">Repeating posts</h2><div class="row"><div><label>Every</label><select id="bxw">${W.map((x,i)=>`<option value="${i}"${i===1?' selected':''}>${x}</option>`).join('')}</select></div><div><label>Time</label><input id="bxt" type="time" value="09:00"></div></div><label>Month</label><input id="bxm" type="month" value="${ym}"><label>Platform</label><select id="bxp">${opts(PLATFORMS)}</select><label>Pillar</label><select id="bxl">${opts(Object.keys(PILLARS))}</select><label>Format</label><input id="bxf" value="Photo"><label>Campaign (optional)</label><input id="bxk"><div class="row" style="margin-top:10px"><button class="p" id="bxg">Create drafts</button></div><p style="font-size:13px;color:var(--mute)">Each draft gets a “[Fill in…]” caption as a placeholder. Dates that already have a post on that platform are skipped.</p>`);
  Q('#bxg').onclick=async()=>{const [y,m]=Q('#bxm').value.split('-').map(Number),wd=+Q('#bxw').value,pl=Q('#bxp').value,pi=Q('#bxl').value,rows=[],ex=new Set(posts.map(p=>p.post_date+'|'+p.platform));
    for(let d=1;d<=new Date(y,m,0).getDate();d++){const dt=new Date(y,m-1,d),ds=iso(dt);if(dt.getDay()!==wd||ex.has(ds+'|'+pl))continue;
      rows.push({client_id:cid,post_date:ds,post_time:Q('#bxt').value||null,platform:pl,pillar:pi,format:Q('#bxf').value.trim(),caption:`[Fill in: ${pi} post for ${dt.toLocaleDateString('en',{month:'short',day:'numeric'})}]`,visual:'',hashtags:'',campaign:Q('#bxk').value.trim(),repost:false,status:'Draft',approval:'Pending'});}
    if(!rows.length)return toast('Nothing to create: those dates already have posts.');
    const r=await sb.from('posts').insert(rows);if(r.error)return alert('Could not create: '+r.error.message);
    Q('#dlg').close();await loadPosts();adminView();toast(rows.length+' draft posts created');};}

/* 10. Campaigns */
function camps(){const g={};posts.forEach(p=>{const k=(p.campaign||'').trim();if(k)(g[k]=g[k]||[]).push(p);});
  const ks=Object.keys(g).sort();
  open('<h2 style="margin-top:0">Campaigns</h2>'+(ks.length?ks.map(k=>{const a=g[k],t=a.length,ap=a.filter(p=>p.approval==='Approved').length,lv_=a.filter(p=>p.status==='Posted').length;
    return `<div class="card" style="margin:8px 0"><b>${esc(k)}</b><div style="height:10px;border-radius:5px;background:var(--line);margin:6px 0;position:relative;overflow:hidden"><div style="position:absolute;inset:0 auto 0 0;width:${ap/t*100}%;background:#7c9cf0"></div><div style="position:absolute;inset:0 auto 0 0;width:${lv_/t*100}%;background:#177a4e"></div></div><small>${t} posts · ${t-ap} not approved · ${ap} approved · ${lv_} live</small></div>`;}).join(''):'<p>No posts have a campaign yet. Add one in the post form’s “Campaign / promo” field.</p>'));}

/* 9. Client speed */
async function speed(){open('<p>Loading…</p>');
  try{const [P,H]=await Promise.all([fetchAll('posts','id,client_id,approval,status'),fetchAll('post_history','post_id,change_type,new_approval,changed_at')]);
    const pc=new Map(P.map(p=>[p.id,p.client_id])),cr=new Map(),ap=new Map();
    H.forEach(h=>{const t=+new Date(h.changed_at);if(h.change_type==='created')cr.set(h.post_id,t);else if(h.new_approval==='Approved'&&!(ap.has(h.post_id)&&ap.get(h.post_id)<t))ap.set(h.post_id,t);});
    const rows=clients.map(c=>{const h=[];ap.forEach((t,id)=>{if(pc.get(id)===c.id&&cr.has(id)&&t>cr.get(id))h.push((t-cr.get(id))/864e5);});h.sort((a,b)=>a-b);
      return {n:c.name,m:h.length?h[h.length>>1]:null,k:h.length,w:P.filter(p=>p.client_id===c.id&&p.approval==='Pending'&&p.status!=='Posted').length};}).sort((a,b)=>(b.m||0)-(a.m||0));
    open('<h2 style="margin-top:0">Client response speed</h2><p style="color:var(--mute);font-size:13px">Median days from a post being created to being approved. Slowest first.</p>'+rows.map(r=>`<div class="card" style="margin:6px 0"><b>${esc(r.n)}</b>: ${r.m==null?'not enough data':'about '+(r.m<1?'under a day':r.m.toFixed(1)+' days')}<br><small>${r.k} approved · ${r.w} waiting now</small></div>`).join(''));
  }catch(e){fail(e);open('<p>Could not load: '+esc(e.message||e)+'</p>');}}

/* 5. Swipe to decide: right = approve (with Undo), left = opens Request changes */
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{capture:true,passive:true});
document.addEventListener('touchend',e=>{
  const ap=Q('#ap'),rc=Q('#rc');if(!ap||!rc||isA()||!e.target.closest('#cm')||e.target.closest('video,iframe,input,textarea,select,.pinwrap,button,a'))return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<110||Math.abs(dy)>60)return;
  e.stopPropagation();(dx>0?ap:rc).click();},{capture:true});

/* 6. Comment at a moment in a video */
function vcm(){const p=posts[idx],v=Q('video.pvid'),t=v?Math.floor(v.currentTime):0,d=open(`<h2 style="margin-top:0">Comment at this time</h2><label>Time (minutes:seconds)</label><input id="bxs" value="${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}" inputmode="numeric"><label>Your comment</label><textarea id="bxy" rows="3" placeholder="For example: logo is cut off"></textarea><div class="row" style="margin-top:10px"><button class="p" id="bxg">Add comment</button></div>`);
  Q('#bxg').onclick=async()=>{const tm=Q('#bxs').value.trim(),tx=Q('#bxy').value.trim();if(!/^\d{1,3}:[0-5]\d$/.test(tm))return toast('Type the time like 0:12');if(!tx)return Q('#bxy').focus();
    const r=await sb.from('comments').insert({post_id:p.id,author_id:user.id,body:`At ${tm}: ${tx}`});if(r.error)return alert('Could not add: '+r.error.message);d.close();showComments(p.id,'#cmx');toast('Comment added');};}

/* 12. Offline: save a read-only snapshot, show it when the app cannot connect */
function snap(){try{if(!isA()&&posts.length&&navigator.onLine)localStorage.setItem('cc_off',JSON.stringify({n:CNAME,t:Date.now(),p:posts.map(x=>[x.post_date,x.post_time,x.platform,x.format,x.approval,x.caption])}));}catch(e){}}
function offView(){let s;try{s=JSON.parse(localStorage.getItem('cc_off'));}catch(e){}if(!s)return;
  $('#app').innerHTML=`<main><h2>${esc(s.n||'Content calendar')}</h2><div class="warn">Offline. This is the calendar as last saved on ${esc(new Date(s.t).toLocaleString())}. You can’t approve until you’re connected.</div>`+s.p.map(r=>`<div class="card" style="margin:8px 0"><b>${esc(r[2])}</b> · ${r[0]?esc(new Date(r[0]+'T00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'})):'No date'} · ${esc(r[4]||'')}<div style="white-space:pre-wrap;margin-top:4px">${esc(r[5]||'')}</div></div>`).join('')+'</main>';}

function run(){
  if(Q('#rt')&&!Q('#bxo')&&localStorage.getItem('cc_off')){const b=document.createElement('button');b.id='bxo';b.type='button';b.style.cssText='width:100%;margin-top:8px';b.textContent='View last saved calendar';b.onclick=offView;Q('#rt').after(b);}
  if(!me)return;
  if(isA()){const h=Q('header');if(h&&!Q('#bxa')){const b=document.createElement('button');b.id='bxa';b.type='button';b.textContent='More tools';b.onclick=menu;h.insertBefore(b,Q('#tl')||Q('#out'));}return;}
  snap();
  const c=Q('#cmx');if(c&&Q('.vbox,.pvid')&&!Q('#bxv')){const b=document.createElement('button');b.id='bxv';b.type='button';b.textContent='⏱ Comment at this time';b.style.margin='10px 0 0';b.onclick=vcm;c.before(b);}
  const ap=Q('#ap');if(ap&&!Q('#bxh')){const s=document.createElement('p');s.id='bxh';s.style.cssText='text-align:center;font-size:12px;color:var(--mute);margin:4px 0';s.textContent='Tip: swipe right to approve, left to request changes';ap.parentNode.after(s);}
}
let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{run();}catch(e){fail(e);}});}).observe(Q('#app'),{childList:true,subtree:true});
})();
</script>

<style>
/* Polish pass */
header{position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line),0 4px 14px #0000000d}
header button{padding:6px 12px;font-size:14px;border-radius:999px}

<script>
/* Add-ons 3: Request approval for selected posts, caught-up card, install prompt, first-visit tips. */
(function(){
'use strict';
const Q=s=>document.querySelector(s),isA=()=>me&&me.role==='admin',fail=e=>console.error('addons3',e);
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;});
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}};

/* Admin: request approval for the posts selected in the bulk bar */
function reqApproval(){
  const ids=[...selSet];if(!ids.length)return toast('Click some posts first.');
  const d=Q('#dlg'),nx=new Date(Date.now()+3*864e5);
  d.innerHTML=`<h2>Request approval</h2><p style="color:var(--mute)">${ids.length} post${ids.length===1?'':'s'} will be set to “waiting for approval”.</p><label for="bxdd">Client should approve by</label><input id="bxdd" type="date" value="${iso(nx)}"><div class="row" style="margin-top:14px"><button class="p" type="button" id="bxgo">Set and write the reminder</button><button type="button" id="bxno">Cancel</button></div>`;d.showModal();
  Q('#bxno').onclick=()=>d.close();
  Q('#bxgo').onclick=async()=>{const dd=Q('#bxdd').value;if(!dd)return Q('#bxdd').focus();
    const r=await sb.from('posts').update({approval:'Pending',due_date:dd}).in('id',ids);if(r.error)return alert('Could not update: '+r.error.message);
    d.close();selSet.clear();await loadPosts();adminView();toast('Approval requested for '+ids.length+' post'+(ids.length===1?'':'s'));
    setTimeout(()=>{const b=Q('#axr');if(b)b.click();},300);};
}

function tips(){
  const d=Q('#dlg');d.innerHTML=`<h2>Welcome 👋</h2><div class="bxi"><span><b>1. Approve</b><br><small>Tap Approve if a post is good to go. Swipe right works too.</small></span></div><div class="bxi"><span><b>2. Change something</b><br><small>Use Request changes, Suggest wording, or Approve with a small fix.</small></span></div><div class="bxi"><span><b>3. Share ideas</b><br><small>Got a photo or offer? Add it in 💡 Ideas.</small></span></div><div class="row" style="margin-top:14px"><button class="p" type="button" id="bxok">Got it</button></div>`;
  d.showModal();Q('#bxok').onclick=()=>d.close();ls('cc_tips','1');
}

function run(){
  if(!me)return;
  if(isA()){const b=Q('#bkb2');if(b&&!Q('#bxq')){const x=document.createElement('button');x.id='bxq';x.type='button';x.className='p';x.textContent='Request approval';x.onclick=reqApproval;b.appendChild(x);}return;}
  const t=Q('#topb');if(!t||lv==='ideas')return;
  if(!ls('cc_tips')&&posts.length&&!Q('#dlg[open]')){ls('cc_tips','1');setTimeout(tips,400);}
  const n=posts.filter(p=>p.approval==='Pending'&&p.status!=='Posted').length;
  if(posts.length&&!n&&!Q('#bxd')){const nxt=posts.find(p=>p.post_date>=iso(new Date())&&p.status!=='Posted'),c=document.createElement('div');c.id='bxd';c.className='bxd';
    c.innerHTML=`<i>🎉</i><b>You’re all caught up</b><span style="color:var(--mute)">Nothing is waiting for your approval.${nxt?' Next post goes live '+esc(new Date(nxt.post_date+'T00:00').toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'}))+'.':''}</span>`;t.prepend(c);}
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!standalone&&!ls('cc_inst')&&!Q('#bxn')&&matchMedia('(max-width:900px)').matches){const c=document.createElement('div');c.id='bxn';c.className='bxi';
    c.innerHTML='<span><b>Add to your home screen</b><br><small>One tap to open, and a badge shows how many posts are waiting.</small></span><span class="row"><button class="p" type="button" id="bxai">How</button><button type="button" id="bxax" aria-label="Dismiss">✕</button></span>';t.appendChild(c);
    Q('#bxax').onclick=()=>{ls('cc_inst','1');c.remove();};
    Q('#bxai').onclick=()=>{if(dip){dip.prompt();dip=null;ls('cc_inst','1');c.remove();}else toast('Tap Share (or the ⋮ menu), then “Add to Home Screen”.');};}
}
let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{run();}catch(e){fail(e);}});}).observe(Q('#app'),{childList:true,subtree:true});
new MutationObserver(()=>{if(isA()&&Q('#bkb2')&&!Q('#bxq'))try{run();}catch(e){fail(e);}}).observe(document.body,{childList:true});
})();
</script>

<script>
/* Add-ons 4: Needs-attention count, campaign filter + colour labels, haptics. */
(function(){
'use strict';
const Q=s=>document.querySelector(s),isA=()=>me&&me.role==='admin',fail=e=>console.error('addons4',e);
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 38%)`;};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

/* Needs attention count (same rules as the list), refreshed at most every 2 minutes */
let cnt=null,cntAt=0,busy=false;
async function count(){
  if(busy||Date.now()-cntAt<12e4)return;busy=true;
  try{const day=d=>Math.round((new Date(d+'T00:00')-new Date(iso(new Date())+'T00:00'))/864e5);
    const [P,C,I]=await Promise.all([fetchAll('posts','id,approval,status,post_date,due_date'),
      sb.from('comments').select('id,post_id').eq('resolved',false).neq('author_id',user.id),
      sb.from('ideas').select('id',{count:'exact',head:true}).eq('source','client').eq('status','Idea')]);
    const o=P.filter(p=>p.status!=='Posted'),ids=new Set(P.map(p=>p.id));
    cnt=o.filter(p=>p.approval==='Changes requested').length+(C.data||[]).filter(c=>ids.has(c.post_id)).length+(I.count||0)
      +o.filter(p=>p.approval==='Pending'&&p.due_date&&day(p.due_date)<0).length
      +o.filter(p=>p.approval!=='Approved'&&p.post_date&&day(p.post_date)>=0&&day(p.post_date)<=3).length;
    cntAt=Date.now();paint();}catch(e){fail(e);cntAt=Date.now();}
  busy=false;}
function paint(){const b=Q('#axa');if(b&&cnt!=null)b.textContent=cnt?'Needs attention · '+cnt:'Needs attention ✓';}
addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#axa'))cntAt=0;},true);

function run(){
  if(!me)return;
  if(!isA()){return;}
  paint();count();
  const lg=Q('.legend[aria-label="Filter the calendar"]');
  if(lg&&!Q('#bxcf')){const cs=[...new Set(posts.map(p=>(p.campaign||'').trim()).filter(Boolean))].sort();
    if(cs.length){const s=document.createElement('select');s.id='bxcf';s.setAttribute('aria-label','Filter by campaign');
      s.innerHTML='<option value="">All campaigns</option>'+cs.map(c=>`<option${c===fCam?' selected':''}>${esc(c)}</option>`).join('');
      s.onchange=()=>{fCam=s.value||null;adminView();};lg.appendChild(s);}}
  document.querySelectorAll('.chip[data-id]:not([data-bxt])').forEach(c=>{c.dataset.bxt='1';
    const p=posts.find(x=>String(x.id)===c.dataset.id),k=p&&(p.campaign||'').trim();
    if(k){const t=document.createElement('span');t.className='bxt';t.style.background=col(k);t.textContent=k;c.appendChild(t);}});
}
let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{run();if(!isA()&&Q('#bxd')&&!Q('#bxd').dataset.v){Q('#bxd').dataset.v='1';vib([30,50,30]);}}catch(e){fail(e);}});}).observe(Q('#app'),{childList:true,subtree:true});
addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#ap,#axf'))vib(25);},true);
})();
</script>
<script>
/* Add-ons 5: clients tap a day on the calendar to request a post for it (saved as an idea with a "needed by" date). */
(function(){
'use strict';
const orig=window.dayTap;
function ask(ds){const d=document.getElementById('dlg');if(d&&d.open)d.close();window.bxPanel(ds);}
window.dayTap=function(ds){
  if(!me||me.role==='admin')return orig(ds);
  const has=posts.some(p=>p.post_date===ds);
  if(!has){if(ds<iso(new Date()))return;return ask(ds);}
  orig(ds);
  const d=document.getElementById('dlg'),row=d.querySelector('#dtx');
  if(d.open&&row&&ds>=iso(new Date())&&!d.querySelector('#rqa')){const b=document.createElement('button');b.type='button';b.id='rqa';b.textContent='+ Add an idea for this day';b.onclick=()=>ask(ds);row.parentNode.insertBefore(b,row);}
};
function btn(){const l=document.getElementById('dayl');if(!l||!me||me.role==='admin'||!selDay||selDay<iso(new Date()))return;
  const h=l.querySelector('#rqd');if(h&&h.dataset.d===selDay)return;if(h)h.remove();
  const b=document.createElement('button');b.id='rqd';b.type='button';b.className='p';b.dataset.d=selDay;b.style.marginTop='10px';b.textContent='+ Add an idea for this day';b.onclick=()=>ask(selDay);l.appendChild(b);}
let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{btn();}catch(e){console.error(e);}});}).observe(document.getElementById('app'),{childList:true,subtree:true});
})();
</script>

<script>
/* Add-ons 6: idea to post with date, idea markers, Today panel, Activity, Approve all, text size, next-step notes, saved replies, print. */
(function(){
'use strict';
const Q=s=>document.querySelector(s),isA=()=>me&&me.role==='admin',fail=e=>console.error('addons6',e);
const nm=id=>((clients.find(c=>c.id===id)||{}).name||'Client');
const nice=d=>new Date(d+'T00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v);}catch(e){}};
const dd=d=>Math.round((new Date(d+'T00:00')-new Date(iso(new Date())+'T00:00'))/864e5);

/* 7. what happens next */
const t0=window.toast;window.toast=function(m,u){if(me&&me.role!=='admin'&&typeof m==='string'){if(/^Approved/.test(m)&&!/will go live/.test(m))m+=' It will go live as scheduled.';else if(/^Changes sent/.test(m))m+=' We\u2019ll update the post and let you know.';}return t0(m,u);};

/* 1. Make post from idea keeps the "needed by" date */
let want='';
addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-m]');if(!b||!isA())return;want='';
  try{const r=await sb.from('ideas').select('notes').eq('id',b.dataset.m).maybeSingle();want=ideaMeta(r.data).by||'';fill();}catch(x){fail(x);}},true);
function fill(){const i=Q('#dlg input[name="post_date"]');if(want&&i&&!i.value){i.value=want;want='';}}
new MutationObserver(fill).observe(Q('#dlg'),{childList:true,subtree:true});

/* 2. idea markers on client calendar */
let ideas=[],iAt=0,iBusy=false;window.bxIdeasRefresh=()=>{iAt=0;};
async function loadIdeas(){if(iBusy||Date.now()-iAt<6e4)return;iBusy=true;
  try{const r=await sb.from('ideas').select('id,notes,status').eq('client_id',cid).eq('source','client').eq('status','Idea');ideas=(r.data||[]).map(i=>ideaMeta(i).by).filter(Boolean);iAt=Date.now();paintI();}catch(e){iAt=Date.now();}iBusy=false;}
function paintI(){document.querySelectorAll('.cgrid .day[data-ds]').forEach(c=>{const has=ideas.includes(c.dataset.ds),m=c.querySelector('.bxk');
  if(has&&!m){const s=document.createElement('span');s.className='bxk';s.title='Your idea is with your social media manager';s.textContent='💡';c.querySelector('span')&&c.querySelector('span').after(s);}else if(!has&&m)m.remove();});}

/* 3 + 4. Today panel and Activity feed (admin) */
let T=null,tAt=0,tBusy=false;
async function today(){if(tBusy||Date.now()-tAt<12e4)return;tBusy=true;
  try{const P=await fetchAll('posts','id,client_id,platform,post_date,post_time,approval,status,due_date'),o=P.filter(p=>p.status!=='Posted'),td=iso(new Date());
    T={live:o.filter(p=>p.post_date===td).sort((a,b)=>(a.post_time||'').localeCompare(b.post_time||'')),wait:o.filter(p=>p.approval==='Pending').length,over:o.filter(p=>p.approval==='Pending'&&p.due_date&&dd(p.due_date)<0).length};tAt=Date.now();paintT();}catch(e){tAt=Date.now();}tBusy=false;}
function paintT(){const m=Q('#app main');if(!m||!T)return;let c=Q('#bxt2');if(!c){c=document.createElement('div');c.id='bxt2';c.className='card';c.style.margin='0 0 12px';m.prepend(c);}
  c.innerHTML='<b>Today</b> · '+esc(nice(iso(new Date())))+'<div style="margin-top:6px;color:var(--mute)">'+(T.live.length?'Going live: '+T.live.map(p=>esc(nm(p.client_id))+' ('+esc(p.platform)+(p.post_time?' '+esc(p.post_time.slice(0,5)):'')+')').join(', '):'Nothing scheduled to go live today.')+'</div><div style="margin-top:4px">'+T.wait+' waiting on clients'+(T.over?' · <b style="color:#c2410c">'+T.over+' overdue</b>':'')+'</div>';}
async function activity(){const d=Q('#dlg');d.innerHTML='<h2>Recent activity</h2><p>Loading…</p>';if(!d.open)d.showModal();
  try{const [P,H,C]=await Promise.all([fetchAll('posts','id,client_id,platform,post_date'),sb.from('post_history').select('post_id,change_type,old_approval,new_approval,changed_at,changed_by').order('changed_at',{ascending:false}).limit(60),sb.from('comments').select('post_id,body,created_at,author_id').order('created_at',{ascending:false}).limit(40)]);
    const by=new Map(P.map(p=>[p.id,p])),ev=[];
    (H.data||[]).forEach(h=>{const p=by.get(h.post_id);if(!p||h.change_type==='created'||h.old_approval===h.new_approval||!h.new_approval||h.changed_by===user.id)return;ev.push({t:h.changed_at,p,x:'marked '+(h.new_approval==='Changes requested'?'changes requested':h.new_approval.toLowerCase())});});
    (C.data||[]).forEach(c=>{const p=by.get(c.post_id);if(p&&c.author_id!==user.id)ev.push({t:c.created_at,p,x:'commented: “'+String(c.body).slice(0,80)+'”'});});
    ev.sort((a,b)=>b.t.localeCompare(a.t));
    d.innerHTML='<h2>Recent activity</h2>'+(ev.slice(0,40).map(e=>`<div class="cm"><b>${esc(nm(e.p.client_id))}</b> ${esc(e.x)}<br><small>${esc(e.p.platform||'')} · ${e.p.post_date?esc(nice(e.p.post_date)):'no date'} · ${esc(new Date(e.t).toLocaleString())}</small></div>`).join('')||'<p>Nothing yet.</p>')+'<div class="row" style="margin-top:14px"><button type="button" id="bxz">Close</button></div>';Q('#bxz').onclick=()=>d.close();
  }catch(e){fail(e);d.innerHTML='<p>Could not load: '+esc(e.message||e)+'</p><button type="button" id="bxz">Close</button>';Q('#bxz').onclick=()=>d.close();}}

/* 5. Approve all remaining (client) */
function approveAll(){const pend=posts.filter(p=>p.approval==='Pending'&&p.status!=='Posted'),d=Q('#dlg');
  d.innerHTML=`<h2>Approve all ${pend.length} remaining?</h2><p style="color:var(--mute)">Only do this if you have looked at them.</p>`+pend.map(p=>`<div class="cm"><b>${esc(p.platform)}${acctLabel(p)}</b> · ${p.post_date?esc(nice(p.post_date)):'No date'}<br><small>${esc((p.caption||'').slice(0,80))}</small></div>`).join('')+'<div class="row" style="margin-top:12px"><button class="ok" type="button" id="bxy">Approve all</button><button type="button" id="bxn">Cancel</button></div>';d.showModal();
  Q('#bxn').onclick=()=>d.close();
  Q('#bxy').onclick=async()=>{Q('#bxy').disabled=true;let bad=0;for(const p of pend){const r=await sb.rpc('set_approval',{p_post:p.id,p_approval:'Approved'});if(r.error)bad++;}
    d.close();await loadPosts();clientView();toast(bad?('Approved '+(pend.length-bad)+', '+bad+' could not be saved'):'All approved. It will go live as scheduled.');};}

/* 9. saved replies (admin comment box) */
const tpl=()=>{try{return JSON.parse(ls('cc_tpl')||'null')||['Done, updated!','Could you send a higher quality photo?','Thanks, scheduled.'];}catch(e){return [];}};
function replies(){const c=Q('#cin');if(!c||Q('#bxqs'))return;const s=document.createElement('select');s.id='bxqs';s.style.width='auto';s.setAttribute('aria-label','Saved replies');
  s.innerHTML='<option value="">Saved replies…</option>'+tpl().map(t=>`<option>${esc(t)}</option>`).join('')+'<option value="__e">Edit list…</option>';
  s.onchange=()=>{if(s.value==='__e'){const v=prompt('One reply per line:',tpl().join('\n'));if(v!==null){ls('cc_tpl',JSON.stringify(v.split('\n').map(x=>x.trim()).filter(Boolean)));s.remove();replies();}return;}
    if(s.value){c.value=(c.value?c.value+' ':'')+s.value;c.dispatchEvent(new Event('input'));s.value='';}};
  c.after(s);}

function run(){
  if(!me)return;
  if(isA()){const h=Q('header');if(h&&!Q('#bxac')){const b=document.createElement('button');b.id='bxac';b.type='button';b.textContent='Activity';b.onclick=activity;h.insertBefore(b,Q('#tl')||Q('#out'));}
    today();paintT();replies();return;}
  const h=Q('header');if(h&&!Q('#bxts')){const b=document.createElement('button');b.id='bxts';b.type='button';b.textContent='Aa';b.setAttribute('aria-label','Text size');b.onclick=()=>{const n=((+document.documentElement.dataset.ts||0)+1)%3;document.documentElement.dataset.ts=n;ls('cc_ts',n);};h.insertBefore(b,Q('#hp')||Q('#out'));}
  if(ls('cc_ts')&&!document.documentElement.dataset.ts)document.documentElement.dataset.ts=ls('cc_ts');
  if(lv==='cal'){loadIdeas();paintI();const r=Q('#cm>.row:first-child');if(r&&!Q('#bxp')){const b=document.createElement('button');b.id='bxp';b.type='button';b.className='noprint';b.textContent='🖨 Print';b.onclick=()=>print();r.appendChild(b);}}
  const tb=Q('#topb'),pend=posts.filter(p=>p.approval==='Pending'&&p.status!=='Posted').length;
  if(tb&&!Q('#bxaa')&&pend>=2&&posts.filter(p=>p.approval==='Approved').length>=3&&lv!=='ideas'){const b=document.createElement('button');b.id='bxaa';b.type='button';b.className='ok';b.style.margin='8px 0';b.textContent='Approve all '+pend+' remaining…';b.onclick=approveAll;tb.appendChild(b);}
}
let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{run();}catch(e){fail(e);}});}).observe(Q('#app'),{childList:true,subtree:true});
})();
</script>

<script>
/* Add-ons 7: idea side panel, Ready to post, Weekly preview, Search, key dates for clients. */
(function(){
'use strict';
const Q=s=>document.querySelector(s),isA=()=>me&&me.role==='admin',fail=e=>console.error('addons7',e);
const nice=d=>new Date(d+'T00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});
const nm=id=>((clients.find(c=>c.id===id)||{}).name||'Client');
const dlg=h=>{const d=Q('#dlg');d.innerHTML=h+'<div class="row" style="margin-top:14px"><button type="button" id="bxq">Close</button></div>';if(!d.open)d.showModal();Q('#bxq').onclick=()=>d.close();return d;};

/* Idea side panel: the calendar stays visible */
window.bxPanel=function(ds){
  const old=Q('#bxpn');if(old)old.remove();
  let kind='',files=[];const p=document.createElement('aside');p.id='bxpn';p.setAttribute('aria-label','Add an idea');
  p.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:19px">💡 Add an idea</h2><button type="button" id="bxpx" aria-label="Close">✕</button></div><p style="color:var(--mute);margin:4px 0 8px">For ${esc(new Date(ds+'T00:00').toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'}))}</p><div class="ibk">${['Event','Promotion','Photo','Question'].map(k=>`<button type="button" class="ibkb" data-k="${k}">${k}</button>`).join('')}</div><label for="bxpn1">Tell us the idea</label><textarea id="bxpn1" rows="4" placeholder="For example: sale this day, please post a reminder"></textarea><div class="row" style="margin-top:8px"><button type="button" id="bxpf">📎 Add photos or videos</button><input type="file" id="bxpi" accept="image/*,video/*" multiple hidden></div><div id="bxpl" style="font-size:13px;color:var(--mute);margin-top:4px"></div><p class="err" id="bxpe" role="status"></p><div class="row" style="margin-top:8px"><button class="p" type="button" id="bxps">Send idea</button></div>`;
  document.body.appendChild(p);document.body.classList.add('bxp');
  const close=()=>{p.remove();document.body.classList.remove('bxp');};
  Q('#bxpx').onclick=close;
  p.querySelectorAll('.ibkb').forEach(b=>b.onclick=()=>{kind=kind===b.dataset.k?'':b.dataset.k;p.querySelectorAll('.ibkb').forEach(x=>x.classList.toggle('on',x.dataset.k===kind));});
  Q('#bxpf').onclick=()=>Q('#bxpi').click();
  Q('#bxpi').onchange=e=>{files=files.concat([...e.target.files]);e.target.value='';Q('#bxpl').textContent=files.map(f=>f.name).join(', ');};
  Q('#bxps').onclick=async()=>{const note=Q('#bxpn1').value.trim(),m=t=>Q('#bxpe').textContent=t;if(!note&&!files.length)return m('Add a note or a photo first.');
    Q('#bxps').disabled=true;m('Sending…');
    const tag=ideaTag(kind,ds),r=await sb.from('ideas').insert({client_id:cid,source:'client',author_id:user.id,notes:(tag+(tag&&note?'\n':'')+note)||null,title:(note||'Photo idea').split('\n')[0].slice(0,60)}).select('id').single();
    if(r.error||!r.data){Q('#bxps').disabled=false;return m('Could not send: '+(r.error?r.error.message:'try again'));}
    if(files.length)await sendMedia(files,r.data.id,m);
    close();toast('Idea sent to your social media manager.');if(window.bxIdeasRefresh)window.bxIdeasRefresh();clientView();};
  Q('#bxpn1').focus();
};

/* Share helper */
function share(title,msg){const e=encodeURIComponent(msg);
  dlg(`<h2 style="margin-top:0">${esc(title)}</h2><textarea id="bxm" rows="7">${esc(msg)}</textarea><div class="row" style="margin-top:10px">${navigator.share?'<button class="p" type="button" id="bxs1">Share…</button>':''}<a href="https://wa.me/?text=${e}" target="_blank" rel="noopener"><button type="button">WhatsApp</button></a><a href="mailto:?subject=${encodeURIComponent(title)}&body=${e}"><button type="button">Email</button></a><button type="button" id="bxc1">Copy</button></div>`);
  if(Q('#bxs1'))Q('#bxs1').onclick=()=>navigator.share({text:Q('#bxm').value}).catch(()=>{});
  Q('#bxc1').onclick=()=>navigator.clipboard.writeText(Q('#bxm').value).then(()=>toast('Copied'),()=>toast('Could not copy'));
  Q('#bxm').oninput=()=>{const v=encodeURIComponent(Q('#bxm').value);document.querySelectorAll('#dlg a').forEach(a=>{a.href=a.href.replace(/(text=|body=)[^&]*/,'$1'+v);});};}

/* 2. Weekly preview */
function weekly(){const td=iso(new Date()),end=iso(new Date(Date.now()+7*864e5)),ps=posts.filter(p=>p.post_date>=td&&p.post_date<end&&p.status!=='Posted');
  if(!ps.length)return toast('Nothing scheduled in the next 7 days.');
  const n=nm(cid).trim();share('Weekly preview',`Hi${n?' '+n:''}! Here is what is going out this week:\n`+ps.map(p=>'• '+nice(p.post_date)+' – '+p.platform+(p.pillar?' ('+p.pillar+')':'')).join('\n')+`\nSee it all here: ${location.origin+location.pathname}`);}

/* 1. Ready to post */
async function ready(){dlg('<h2 style="margin-top:0">Ready to post today</h2><p>Loading…</p>');
  try{const td=iso(new Date()),P=(await fetchAll('posts','id,client_id,platform,post_date,post_time,caption,hashtags,visual,status,approval')).filter(p=>p.post_date===td&&p.status!=='Posted').sort((a,b)=>(a.post_time||'').localeCompare(b.post_time||''));
    dlg('<h2 style="margin-top:0">Ready to post today</h2>'+(P.length?P.map((p,i)=>`<div class="card" style="margin:8px 0" data-r="${i}"><b>${esc(nm(p.client_id))}</b> · ${esc(p.platform)}${p.post_time?' · '+esc(p.post_time.slice(0,5)):''} <span class="badge ${p.approval==='Approved'?'b-Approved':'b-Pending'}">${esc(p.approval==='Approved'?'Approved':'Not approved')}</span><div style="white-space:pre-wrap;color:var(--mute);margin:6px 0;max-height:80px;overflow:hidden">${esc(p.caption||'')}</div><div class="row"><button type="button" data-a="c">Copy caption + tags</button>${/^https?:/i.test(p.visual||'')?`<a href="${esc(p.visual)}" target="_blank" rel="noopener"><button type="button">Open media</button></a>`:''}<button type="button" class="ok" data-a="d">Mark as posted</button></div></div>`).join(''):'<p>Nothing left to post today. 🎉</p>'));
    document.querySelectorAll('#dlg [data-r]').forEach(c=>{const p=P[+c.dataset.r];
      c.querySelector('[data-a=c]').onclick=()=>navigator.clipboard.writeText((p.caption||'')+(p.hashtags?'\n\n'+p.hashtags:'')).then(()=>toast('Copied'),()=>toast('Could not copy'));
      c.querySelector('[data-a=d]').onclick=async()=>{const r=await sb.from('posts').update({status:'Posted'}).eq('id',p.id);if(r.error)return alert('Could not update: '+r.error.message);c.remove();toast('Marked as posted');if(p.client_id===cid)loadPosts();};});
  }catch(e){fail(e);dlg('<p>Could not load: '+esc(e.message||e)+'</p>');}}

/* 3. Search */
function search(){const d=dlg('<h2 style="margin-top:0">Search posts</h2><input id="bxsi" placeholder="Caption, campaign, hashtag or platform" autocomplete="off"><div id="bxsr" style="margin-top:8px"></div>');
  const go=()=>{const q=Q('#bxsi').value.trim().toLowerCase(),r=Q('#bxsr');if(q.length<2){r.innerHTML='';return;}
    const hit=posts.filter(p=>[p.caption,p.campaign,p.hashtags,p.platform,p.pillar].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,30);
    r.innerHTML=hit.map((p,i)=>`<button type="button" class="wp" data-h="${i}" style="display:block;width:100%;text-align:left;margin:4px 0"><b>${esc(p.platform)}${acctLabel(p)}</b> · ${p.post_date?esc(nice(p.post_date)):'No date'}<br><small>${esc((p.caption||'').slice(0,90))}</small></button>`).join('')||'<p style="color:var(--mute)">No matches.</p>';
    r.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const p=hit[+b.dataset.h];d.close();if(isA())postForm(p);else{lv=false;idx=posts.indexOf(p);clientView();scrollTo(0,0);}});};
  Q('#bxsi').oninput=go;Q('#bxsi').focus();}

function run(){
  if(!me)return;const h=Q('header');
  const add=(id,t,f,before)=>{if(h&&!Q('#'+id)){const b=document.createElement('button');b.id=id;b.type='button';b.textContent=t;b.onclick=f;h.insertBefore(b,before||Q('#out'));}};
  if(isA()){add('bxrd','Ready to post',ready,Q('#tl'));add('bxwk','Weekly preview',weekly,Q('#tl'));add('bxse','Search',search,Q('#tl'));return;}
  add('bxse','🔍',search,Q('#hp')||Q('#out'));
  document.querySelectorAll('.cgrid .day[data-ds]').forEach(c=>{if(c.querySelector('.bxh'))return;
    const k=keyDates.filter(x=>x.key_date===c.dataset.ds);if(k.length){const d=document.createElement('div');d.className='bxh';d.textContent='★ '+k.map(x=>x.label).join(', ');c.appendChild(d);}});
}
let raf=0;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{run();}catch(e){fail(e);}});}).observe(Q('#app'),{childList:true,subtree:true});
})();
</script>
<script>
(function(){
const Q=s=>document.querySelector(s),addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mon=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
const nice=ds=>new Date(ds+'T00:00').toLocaleDateString('en',{month:'short',day:'numeric'});
const bkAge=()=>{try{const t=localStorage.getItem('cc_bk');return t?Math.floor((Date.now()-(+t))/864e5):999;}catch(e){return 999;}};
const _ec=window.exportCsv;window.exportCsv=function(){try{localStorage.setItem('cc_bk',String(Date.now()));}catch(e){}return _ec.apply(this,arguments);};
const bkWarn=()=>bkAge()>7?'<div class="warn" id="bkw">Your last backup was '+(bkAge()>900?'never made':bkAge()+' days ago')+'. <button type="button" id="bkx" style="margin-left:6px">Export a backup now</button></div>':'';
function bind(){const b=Q('#bkx');if(b)b.onclick=()=>{window.exportCsv();setTimeout(()=>{const w=Q('#bkw');if(w)w.remove();},300);};}
async function todayView(){
  const td=iso(new Date()),tm=iso(addD(new Date(),1));
  const ps=posts.filter(p=>p.post_date===td||p.post_date===tm).sort((a,b)=>(a.post_date+(a.account||'')+(a.post_time||'')).localeCompare(b.post_date+(b.account||'')+(b.post_time||'')));
  const media={};
  if(ps.length){const r=await sb.from('post_media').select('post_id,drive_link,status').in('post_id',ps.map(p=>p.id));(r.data||[]).forEach(m=>{if(m.status==='done'&&m.drive_link&&!media[m.post_id])media[m.post_id]=m.drive_link;});}
  const card=p=>{const l=media[p.id]||(/^https?:\/\//i.test(p.visual||'')?p.visual:'');
    return `<div class="card" style="margin-bottom:10px"><div class="row"><b>${acctDot(p)}${esc(p.platform)}${acctLabel(p)}</b><span style="color:var(--mute);font-size:13px">${p.post_date===td?'Today':'Tomorrow'}${p.post_time?' \u00b7 '+esc(p.post_time.slice(0,5)):''}</span><span class="sb s-${esc(p.status)}" style="margin-left:auto">${esc(p.status)}</span></div><div class="cap">${p.caption?esc(p.caption):'<i style="color:var(--mute)">No caption yet</i>'}</div>${p.hashtags?`<div class="ptags">${esc(p.hashtags)}</div>`:''}<div class="row" style="margin-top:10px"><button type="button" class="p tcp" data-id="${p.id}">Copy caption + hashtags</button>${l?`<a class="lnk" href="${esc(l)}" target="_blank" rel="noopener noreferrer">Open photo</a>`:''}${p.status==='Posted'?'<span class="sb s-Posted">Posted \u2713</span>':`<button type="button" class="tdn" data-id="${p.id}">Mark as posted</button>`}<button type="button" class="ted" data-id="${p.id}">Edit</button></div></div>`;};
  const gaps=[],w0=mon(new Date());
  for(let i=0;i<4;i++){const a=iso(addD(w0,i*7)),b=iso(addD(w0,i*7+6));ACCOUNTS.forEach(ac=>{const g=+ac.goal||0;if(!g)return;const n=posts.filter(p=>p.platform===ac.platform&&p.account===ac.name&&p.post_date>=a&&p.post_date<=b).length;if(n<g)gaps.push(`<div class="cm"><b>${acctDot({platform:ac.platform,account:ac.name})}${esc(ac.platform)} \u00b7 ${esc(ac.name)}</b> \u00b7 week of ${nice(a)}: ${n} of ${g} planned <span class="sb b-Pending">${g-n} to add</span></div>`);});}
  $('#app').innerHTML=miniHead()+`<main><div class="row" style="margin-bottom:6px"><div style="flex:1"><h2 style="margin:0">${new Date().toLocaleDateString('en',{weekday:'long'})} \u00b7 ${ps.filter(p=>p.post_date===td&&p.status!=='Posted').length} post${ps.filter(p=>p.post_date===td&&p.status!=='Posted').length===1?'':'s'} to publish</h2><div style="color:var(--mute);font-size:14px">${nice(td)} \u00b7 copy, post, then tap Mark as posted</div></div><button type="button" id="tbk">Back to calendar</button></div>${bkWarn()}
  <div class="row noprint" style="margin:10px 0"><button type="button" id="trm">Approval reminder</button><button type="button" id="trp">Account report</button></div>
  ${ps.length?ps.map(card).join(''):'<div class="empty">Nothing planned for today or tomorrow.</div>'}
  <h3>Gaps in the next 4 weeks</h3><div class="card">${gaps.join('')||'<span style="color:var(--mute)">'+(ACCOUNTS.length?'Every account is on target. \ud83c\udf89':'Add your accounts and weekly goals in Settings to see gaps.')+'</span>'}</div></main>`;
  miniBind(todayView);bind();
  $('#tbk').onclick=()=>{vw='month';adminView();};$('#trm').onclick=remind;$('#trp').onclick=report;
  const re=async()=>{await loadPosts();todayView();};
  document.querySelectorAll('.tcp').forEach(b=>b.onclick=()=>{const p=posts.find(x=>x.id===b.dataset.id);navigator.clipboard.writeText((p.caption||'')+(p.hashtags?'\n\n'+p.hashtags:'')).then(()=>toast('Copied. Paste it into the post.'),()=>alert('Could not copy. Open the post and copy by hand.'));});
  document.querySelectorAll('.ted').forEach(b=>b.onclick=()=>postForm(posts.find(x=>x.id===b.dataset.id)));
  document.querySelectorAll('.tdn').forEach(b=>b.onclick=async()=>{const u=prompt('Paste the live post link (or leave empty):');if(u===null)return;const f={status:'Posted'};if(u.trim())f.live_link=u.trim();const r=await sb.from('posts').update(f).eq('id',b.dataset.id);if(r.error)return alert('Could not save: '+r.error.message);re();});
}
function remind(){const d=Q('#dlg'),pend=posts.filter(p=>p.approval==='Pending'&&p.post_date&&p.status!=='Posted').sort((a,b)=>a.post_date.localeCompare(b.post_date));
  const nm=(clients.find(c=>c.id===cid)||{}).name||'';
  const t=pend.length?`Hi ${nm}! You have ${pend.length} post${pend.length===1?'':'s'} waiting for your approval. The first one goes live on ${nice(pend[0].post_date)}. Please review them here: ${location.origin+location.pathname}\nThank you!`:`Hi ${nm}! Everything is approved. Thank you!`;
  d.innerHTML='<h2 style="margin-top:0">Approval reminder</h2><textarea id="rmt" rows="6"></textarea><div class="row" style="margin-top:10px"><button type="button" class="p" id="rmc">Copy message</button><button type="button" id="rmx">Close</button></div>';
  $('#rmt').value=t;d.showModal();$('#rmx').onclick=()=>d.close();$('#rmc').onclick=()=>navigator.clipboard.writeText($('#rmt').value).then(()=>toast('Copied'));}
function report(){const d=Q('#dlg');
  d.innerHTML=`<h2 style="margin-top:0">Account report</h2><label>Account</label><select id="ra"><option value="">All accounts</option>${ACCOUNTS.map((a,i)=>`<option value="${i}">${esc(a.platform)} \u00b7 ${esc(a.name)}</option>`).join('')}</select><label>Month</label><input type="month" id="rm" value="${iso(new Date()).slice(0,7)}"><div class="row" style="margin-top:12px"><button type="button" class="p" id="rgo">Open printable report</button><button type="button" id="rx">Close</button></div>`;
  d.showModal();$('#rx').onclick=()=>d.close();
  $('#rgo').onclick=()=>{const a=ACCOUNTS[+$('#ra').value],m=$('#rm').value,nm=(clients.find(c=>c.id===cid)||{}).name||'';
    const rows=posts.filter(p=>p.post_date&&p.post_date.slice(0,7)===m&&(!a||(p.platform===a.platform&&p.account===a.name))).sort((x,y)=>x.post_date.localeCompare(y.post_date));
    const sum=k=>rows.reduce((t,p)=>t+(+p[k]||0),0),n=v=>(+v||0).toLocaleString();
    const w=window.open('','_blank');if(!w)return alert('Allow pop-ups for this site to open the report.');
    w.document.write(`<!doctype html><meta charset="utf-8"><title>Report</title><body style="font:14px system-ui;margin:28px;color:#1d2030"><h1 style="margin:0">${esc(nm)}${a?' \u00b7 '+esc(a.platform)+' \u00b7 '+esc(a.name):''}</h1><p style="color:#6b6f85">${esc(m)} \u00b7 ${rows.length} posts \u00b7 ${rows.filter(p=>p.status==='Posted').length} posted</p><p><b>Reach</b> ${n(sum('reach'))} \u00b7 <b>Likes</b> ${n(sum('likes'))} \u00b7 <b>Comments</b> ${n(sum('comments_count'))} \u00b7 <b>Shares</b> ${n(sum('shares_saves'))} \u00b7 <b>Engagements</b> ${n(sum('engagements'))}</p><table style="border-collapse:collapse;width:100%;font-size:13px"><tr style="text-align:left;border-bottom:2px solid #ccc"><th>Date</th><th>Account</th><th>Format</th><th>Status</th><th>Caption</th><th>Reach</th><th>Eng.</th></tr>${rows.map(p=>`<tr style="border-top:1px solid #ddd"><td>${esc(p.post_date)}</td><td>${esc(p.platform)}${p.account?' \u00b7 '+esc(p.account):''}</td><td>${esc(p.format||'')}</td><td>${esc(p.status)}</td><td>${esc((p.caption||'').slice(0,90))}</td><td>${n(p.reach)}</td><td>${n(p.engagements)}</td></tr>`).join('')}</table></body>`);
    w.document.close();w.focus();setTimeout(()=>w.print(),400);};}
function formX(p){const f=Q('#pf');if(!f)return;
  window.__addFiles=null;window.__pfl=null;
  if(p&&!p.id&&Q('#upx')){const fl=[];Q('#upx').innerHTML='<div class="upl"><h3 style="margin:0 0 6px">Photos &amp; videos</h3><div id="pfl" style="color:var(--mute);font-size:13px;margin-bottom:8px">No files chosen yet. Drag photos here, or use the button. They upload automatically when you click Save post.</div><button type="button" class="p ubig" id="pfb">\ud83d\udcf7 Add photo or video</button><input type="file" id="pff" accept="image/*,video/*" multiple hidden></div>';
    Q('#pfb').onclick=()=>Q('#pff').click();
    Q('#pff').onchange=e=>{fl.push(...e.target.files);e.target.value='';Q('#pfl').textContent=fl.length?fl.map(x=>x.name).join(', '):'No files chosen yet.';};
    window.__pfl=fl;window.__addFiles=a=>{fl.push(...a);Q('#pfl').textContent=fl.map(x=>x.name).join(', ');};if(window.__rf){window.__addFiles(window.__rf);window.__rf=null;}
    const o=f.onsubmit;f.onsubmit=e=>{window.__pf2=fl.slice();return o.call(f,e);};}
  if(p&&p.id&&window.__pf2&&window.__pf2.length){const fl=window.__pf2;window.__pf2=null;let n=0;const iv=setInterval(()=>{const inp=Q('#umf');if(inp){clearInterval(iv);const dt=new DataTransfer();fl.forEach(x=>dt.items.add(x));inp.files=dt.files;inp.dispatchEvent(new Event('change'));}else if(++n>40)clearInterval(iv);},300);}
  const hs=Q('#hs'),ac=f.elements.namedItem('account');
  if(hs&&ac){const all=hsets.slice(),fill=()=>{const a=(ac.value||'').toLowerCase();hs.innerHTML='<option value="">Add a saved hashtag set...</option>'+all.filter(h=>{const n=h.name.toLowerCase();return !ACCOUNTS.some(x=>n.includes(x.name.toLowerCase()))||(a&&n.includes(a));}).map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');};ac.addEventListener('change',fill);fill();}
  if(p&&p.id&&ACCOUNTS.length>1&&Q('#pe')){
    const others=ACCOUNTS.filter(a=>!(a.platform===p.platform&&a.name===p.account)),box=document.createElement('div');box.className='card';box.style.cssText='margin:12px 0;padding:10px';
    box.innerHTML=`<b>Also post to\u2026</b> <small style="color:var(--mute)">(copies the saved version)</small><div class="row" style="margin-top:6px">${others.map((a,i)=>`<label style="display:flex;gap:6px;align-items:center;color:var(--ink);margin:0"><input type="checkbox" class="apt" value="${i}" style="width:auto;min-height:0">${esc(a.platform)} \u00b7 ${esc(a.name)}</label>`).join('')}</div><button type="button" id="aptb" style="margin-top:8px">Create copies as drafts</button>`;
    Q('#pe').before(box);
    box.querySelector('#aptb').onclick=async()=>{const sel=[...box.querySelectorAll('.apt:checked')].map(c=>others[+c.value]);if(!sel.length)return;
      const rows=sel.map(a=>({client_id:p.client_id||cid,post_date:p.post_date,post_time:p.post_time,platform:a.platform,account:a.name,pillar:p.pillar,format:p.format,campaign:p.campaign,caption:p.caption,visual:p.visual,hashtags:p.hashtags,status:'Draft',approval:'Pending',repost:false}));
      const r=await sb.from('posts').insert(rows);if(r.error)return alert('Could not create: '+r.error.message);
      Q('#dlg').close();await loadPosts();adminView();toast(rows.length+' draft'+(rows.length>1?'s':'')+' created');};}
}
const _pf=window.postForm;window.postForm=function(p){const r=_pf.apply(this,arguments);try{formX(p||{});}catch(e){console.error('addon',e);}return r;};
function nav(){const s=Q('#sbar');if(!s||s.querySelector('[data-v=today]'))return;const b=document.createElement('button');b.className='ni'+(vw==='today'?' on':'');b.dataset.v='today';b.innerHTML='<i>\u25b6</i><span>Post today</span>';const lo=s.querySelector('.lo');lo?lo.after(b):s.prepend(b);}
const _av=window.adminView;
window.adminView=function(){
  if(vw==='today'){todayView();setTimeout(nav,0);return;}
  const r=_av.apply(this,arguments);setTimeout(nav,0);
  try{const s=Q('.sumrow');if(s&&!Q('#bkw')&&bkWarn()){s.insertAdjacentHTML('beforebegin',bkWarn());bind();}}catch(e){}
  return r;};
})();

<style>

.grid .dow{background:none;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.grid .day{border-radius:14px;border:1px solid var(--line);padding:6px}
.card,.stat,.sumrow,.wd,.nb,.login,dialog{border-radius:16px}
.chip{border-radius:10px;border-right:4px solid var(--ac,transparent)}
.chip .cl2{color:var(--ink);opacity:.8;font-size:11.5px}
.chip:not(.dim){opacity:1!important}
.sb{font-size:11px}
.chip:has(.s-Posted) .cl2{display:none}
.chip:has(.s-Posted) .th{height:48px}
.chip:has(.b-Pending),.chip:has(.b-Changes){box-shadow:0 0 0 2px #e8780f}
.chip:has(.b-Changes){box-shadow:0 0 0 2px #e5484d}
header{position:sticky;top:0;z-index:25;background:var(--card)!important;gap:8px}
details.hm{position:relative}
details.hm>summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px}
details.hm>summary::-webkit-details-marker{display:none}details.hm>summary::after{content:" \25be"}
details.hm .hmi{position:absolute;right:0;top:112%;z-index:40;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:190px;box-shadow:0 10px 30px #0005}
details.hm .hmi button{text-align:left;width:100%}
/* More menu fix: keep the label and arrow on one line, never let the header squash the button */
details.hm,details.menu{flex:none}
details.hm>summary,details.menu>summary{display:inline-flex!important;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:36px;padding:6px 14px;font-size:14px;line-height:1.2;border-radius:999px;user-select:none}
details.hm>summary::after,details.menu>summary::after{content:"\25be"!important;margin:0;line-height:1}
details.hm[open]>summary::after,details.menu[open]>summary::after{content:"\25b4"!important}
details.hm .hmi{max-height:70vh;overflow:auto;max-width:92vw}
@media(max-width:640px){details.hm .hmi{position:fixed;left:12px;right:12px;top:64px;min-width:0}}
.login{padding:34px;box-shadow:0 20px 60px #0006}
.tcp,.tdn{min-height:48px;font-size:16px}
</style>
<script>
(function(){
const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap';document.head.appendChild(l);
const keep=b=>b.id==='np'||/^(needs attention|search)/i.test(b.textContent.trim())||!/[a-z]/i.test(b.textContent)||b.closest('details');
function tidy(){
  const h=document.querySelector('header');
  if(h&&!h.querySelector('.hm')){
    const mv=[...h.children].filter(c=>c.tagName==='BUTTON'&&!keep(c)&&c.id!=='out'&&c.id!=='tl'&&c.id!=='hp');
    if(mv.length>2){const d=document.createElement('details');d.className='hm';d.innerHTML='<summary>More</summary><div class="hmi"></div>';
      const box=d.querySelector('.hmi');mv.forEach(b=>box.appendChild(b));const o=h.querySelector('#out')||null;h.insertBefore(d,o);
      d.onclick=e=>{if(e.target.closest('button'))setTimeout(()=>d.removeAttribute('open'),0);};}}
  try{const nm=((typeof clients!=='undefined'&&clients.find(c=>c.id===cid))||{}).name||(typeof CNAME!=='undefined'?CNAME:'')||'';
    document.querySelectorAll('.chip').forEach(c=>{const p=c.dataset.id?posts.find(x=>x.id===c.dataset.id):c.dataset.i!==undefined?posts[+c.dataset.i]:null;
      const col=p&&p.account&&accCol(p);if(col)c.style.setProperty('--ac',col);});}catch(e){}
}
let t=null;new MutationObserver(()=>{if(t)return;t=requestAnimationFrame(()=>{t=null;tidy();});}).observe(document.getElementById('app'),{childList:true,subtree:true});
tidy();
})();
</script>
<script>
/* close any open "More" menu when you click elsewhere or press Escape */
document.addEventListener('click',e=>{document.querySelectorAll('details.hm[open],details.menu[open]').forEach(d=>{if(!d.contains(e.target))d.removeAttribute('open');});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details.hm[open],details.menu[open]').forEach(d=>d.removeAttribute('open'));});
</script>
<style>dialog.dz{outline:3px dashed var(--acc);outline-offset:-8px}</style>
<script>
(function(){
const d=document.getElementById('dlg'),Q=s=>document.querySelector(s);
let down=false,cur=null,draft=null;
const out=e=>{const r=d.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;};
const _pf=window.postForm;window.postForm=function(p){cur=p||{};return _pf.apply(this,arguments);};
function pill(){let b=Q('#drf');if(!b){b=document.createElement('button');b.id='drf';b.type='button';b.className='p';b.style.cssText='position:fixed;right:20px;bottom:20px;z-index:60;border-radius:24px;box-shadow:0 8px 24px #0006';
  b.onclick=()=>{const x=draft;draft=null;b.remove();window.__rf=x.files;postForm(x.p);};document.body.appendChild(b);}
  b.textContent='\u270e Resume unsaved post';}
function stash(){const f=Q('#pf');if(!f||!d.open)return;const fd=Object.fromEntries(new FormData(f));fd.repost=fd.repost==='on';
  const files=(window.__pfl||[]).slice(),o=cur||{};
  if(files.length||['caption','hashtags','visual','campaign','notes'].some(k=>(fd[k]||'')!==(o[k]||''))){draft={p:{...o,...fd,_saved:undefined},files};pill();}
  d.close();}
d.addEventListener('mousedown',e=>{down=out(e);});
d.addEventListener('click',e=>{if(down&&Q('#pf')&&out(e))stash();down=false;});
d.addEventListener('cancel',()=>{if(Q('#pf'))stash();});
['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{if(!e.dataTransfer||![...e.dataTransfer.types].includes('Files'))return;e.preventDefault();d.classList.add('dz');}));
d.addEventListener('dragleave',e=>{if(e.target===d)d.classList.remove('dz');});
d.addEventListener('drop',e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();d.classList.remove('dz');const fs=[...e.dataTransfer.files];
  if(window.__addFiles&&Q('#pff'))return window.__addFiles(fs);
  const inp=Q('#umf');if(!inp)return;const dt=new DataTransfer();fs.forEach(x=>dt.items.add(x));inp.files=dt.files;inp.dispatchEvent(new Event('change'));});
})();
</script>
