    sb.from('key_dates').select('*').eq('client_id',cid).order('key_date'),

      return {client_id:cid,post_date:iso(t),post_time:p.post_time,platform:p.platform,pillar:p.pillar,format:p.format,caption:p.caption,visual:p.visual,hashtags:p.hashtags,campaign:p.campaign,repost:false,status:'Draft',approval:'Pending'};});
    const r=await sb.from('posts').insert(rows).select('id');
    if(r.error)return alert('Could not copy: '+r.error.message);
    d.close();month=new Date(ny,nm,1);await loadPosts();adminView();
    const ids=(r.data||[]).map(x=>x.id);
    toast('Copied '+rows.length+' posts.',async()=>{await sb.from('posts').delete().in('id',ids);await loadPosts();adminView();});};
}

  // weekly pace (current week, Mon–Sun)

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('Could not load the Excel reader. Check your internet connection.'));document.head.appendChild(sc);});}
const XMAP={'date':'post_date','time (client)':'post_time','platform':'platform','content pillar':'pillar','format':'format','campaign / promo':'campaign','post copy / caption':'caption','visual / photo (link or status)':'visual','hashtags / tags (pick a set or type)':'hashtags','status':'status','client approval':'approval','assets ready?':'assets_ready','live link':'live_link','notes':'notes','reach':'reach','likes':'likes','comments':'comments_count','shares / saves':'shares_saves','dms / inquiries':'dms_inquiries','link clicks':'link_clicks','engagements':'engagements','asset due date':'asset_due_date','location(s)':'locations','content type':'content_type','approved by':'approved_by','approved on':'approved_on','repost?':'repost','cta (call to action)':'cta','tracking link (utm)':'tracking_url'};
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const name=wb.SheetNames.includes('Posts')?'Posts':wb.SheetNames.find(n=>/post/i.test(n));
  if(!name) throw new Error('No "Posts" sheet found in this file.');
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
  const hi=rows.findIndex(r=>{const t=r.map(x=>String(x??'').trim().toLowerCase());return t.includes('date')&&t.includes('platform');});
  if(hi<0) throw new Error('Could not find the header row (Date, Platform...) in the Posts sheet.');
  const RULES=[[/^time\b/,'post_time'],[/^hashtags/,'hashtags'],[/^visual/,'visual'],[/^post copy|^caption/,'caption'],[/^campaign/,'campaign'],[/^location/,'locations'],[/^cta/,'cta'],[/^tracking/,'tracking_url'],[/^content pillar|^pillar/,'pillar'],[/^client approval|^approval/,'approval']];

  const hdr=rows[hi].map(mapH);
  const txt=v=>{if(v==null||v==='')return null;const t=String(v).trim();return (!t||/^none$/i.test(t))?null:t;};
  const num=v=>{if(v==null||v==='')return null;const n=Number(v);return isFinite(n)?Math.round(n):null;};
  const toDate=v=>{if(v==null||v==='')return null;if(typeof v==='number'){return new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000).toISOString().slice(0,10);}const t=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);const x=new Date(t);return isNaN(x)?null:iso(x);};
  const toTime=v=>{if(typeof v==='number'){const m=Math.round((v%1)*1440);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}if(typeof v==='string'){const m=v.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);if(m){let h=+m[1];if(m[3]){const pm=/pm/i.test(m[3]);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0;}return String(h).padStart(2,'0')+':'+m[2];}}return null;};
  const pick=(v,list,def)=>{const t=txt(v);if(!t)return def;return list.find(x=>x.toLowerCase()===t.toLowerCase())||def;};

    if(!date||!txt(o.platform)){ if(r.some(v=>v!=null&&v!=='')&&Object.values(o).some(v=>v!=null&&v!=='')) skipped++; return; }
    const post={client_id:cid,post_date:date,post_time:toTime(o.post_time),platform:pick(o.platform,PLATFORMS,txt(o.platform)),pillar:txt(o.pillar),format:txt(o.format),campaign:txt(o.campaign),caption:txt(o.caption),visual:txt(o.visual),hashtags:txt(o.hashtags),status:pick(o.status,STATUS,'Draft'),approval:pick(o.approval,APPR,'Pending'),assets_ready:txt(o.assets_ready),live_link:txt(o.live_link),notes:txt(o.notes),asset_due_date:toDate(o.asset_due_date),locations:txt(o.locations),content_type:txt(o.content_type),repost:/^y/i.test(txt(o.repost)||''),cta:txt(o.cta),tracking_url:txt(o.tracking_url),reach:num(o.reach),likes:num(o.likes),comments_count:num(o.comments_count),shares_saves:num(o.shares_saves),dms_inquiries:num(o.dms_inquiries),link_clicks:num(o.link_clicks),engagements:num(o.engagements)};

}

function parseCsv(t){
  t=String(t||'').replace(/^﻿/,'');
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[];}
    else f+=c;}
  r.push(f);if(r.some(x=>x!==''))rows.push(r);
  return rows;}
function metaDate(s){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))){let mo=+m[1],dd=+m[2];if(mo>12&&dd<=12){const x=mo;mo=dd;dd=x;}
    return m[3]+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0');}
  return null;}
const mnorm=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
const mnum=v=>{if(v==null)return null;const t=String(v).replace(/,/g,'').trim();if(t==='')return null;const n=Number(t);return isFinite(n)?Math.round(n):null;};
function metaRows(text){
  const rows=parseCsv(text);if(rows.length<2)throw new Error('That file looks empty.');
  const H=rows[0].map(h=>String(h).trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=H.indexOf(n);if(i>=0)return i;}return -1;};
  const c={page:col('page name','account name','username'),title:col('title'),desc:col('description'),time:col('publish time','publish date','date published'),link:col('permalink','post link'),reach:col('reach'),likes:col('reactions','likes'),com:col('comments'),sh:col('shares'),sv:col('saves'),lc:col('link clicks'),eng:col('reactions, comments and shares','engagements')};
  if(c.time<0||c.reach<0)throw new Error('This does not look like a Meta Business Suite posts export (it needs "Publish time" and "Reach" columns).');
  const g=(r,i)=>i>=0?r[i]:null;
  const out=[];
  rows.slice(1).forEach(r=>{
    const date=metaDate(g(r,c.time));if(!date)return;
    const cap=String(g(r,c.title)||g(r,c.desc)||'').trim();
    const link=String(g(r,c.link)||'').trim();
    const pl=/facebook\.com/i.test(link)?'Facebook':/instagram\.com/i.test(link)?'Instagram':/tiktok\.com/i.test(link)?'TikTok':/linkedin\.com/i.test(link)?'LinkedIn':null;

    const ss=(sh!=null||sv!=null)?(sh||0)+(sv||0):null;
    let eng=mnum(g(r,c.eng));if(eng==null&&(likes!=null||com!=null||ss!=null))eng=(likes||0)+(com||0)+(ss||0);
    out.push({page:String(g(r,c.page)||'').trim(),cap,date,link,platform:pl,reach:mnum(g(r,c.reach)),likes,comments_count:com,shares_saves:ss,link_clicks:mnum(g(r,c.lc)),engagements:eng});

function matchMeta(rows,posts,page){
  const ps=posts.filter(p=>p.caption&&p.post_date).map(p=>({p,n:mnorm(p.caption)})).filter(x=>x.n.length>=12);
  const used=new Set(),matched=[],unmatched=[];
  const days=(a,b)=>Math.abs((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
  rows.filter(r=>!page||r.page===page).forEach(r=>{

      const d=days(r.date,p.post_date);

  });

async function uploadPostFile(p,f){
  const ext=(f.name.split('.').pop()||'').toLowerCase(),type=f.type||MIME_BY_EXT[ext]||'';
  if(!Object.values(MIME_BY_EXT).includes(type))return {ok:false,error:'"'+f.name+'" is not a photo or video type we can use.'};
  if(f.size>52428800)return {ok:false,error:'"'+f.name+'" is over 50 MB. Please send a shorter clip.'};
  const clean=f.name.replace(/[^\w.\-]+/g,'_').slice(0,60),path=p.client_id+'/'+p.id+'/'+Date.now()+'_'+clean;
  const u=await sb.storage.from('temp-media').upload(path,f,{contentType:type,upsert:false});
  if(u.error)return {ok:false,error:'Could not upload "'+f.name+'": '+u.error.message};
  let st=null;
  for(let i=0;i<45&&!st;i++){await waitMs(1500);const r=await sb.from('post_media').select('status').eq('storage_path',path).maybeSingle();if(r.data&&r.data.status!=='processing')st=r.data.status;}
  if(st==='failed')return {ok:false,error:'"'+f.name+'" could not be sent. Please try again or remove it.'};
  return {ok:true,name:clean,status:st};
}

<script>
/* Add-ons: caption counter, Board view, "Duplicate now". Runs after the main script; needs no database changes. */
(function(){
'use strict';
const LIM={'Instagram':2200,'TikTok':4000,'LinkedIn':3000,'Google Business Profile':1500,'Facebook':63206};

function addCounter(){
  const f=document.getElementById('pf');
  if(!f||f.dataset.cc)return;
  const ta=f.elements.namedItem('caption'),pl=f.elements.namedItem('platform'),ht=f.elements.namedItem('hashtags');
  if(!ta||!pl)return;
  f.dataset.cc='1';
  const o=document.createElement('div');
  o.id='ccount';o.setAttribute('aria-live','polite');
  ta.insertAdjacentElement('afterend',o);
  const upd=()=>{
    const n=[...ta.value].length,lim=LIM[pl.value]||0;
    let t=n.toLocaleString()+' characters',cls='';
    if(lim&&lim<10000){
      t=n.toLocaleString()+' / '+lim.toLocaleString();
      if(n>lim)cls='over';else if(n>lim*0.9)cls='near';
    }
    if(pl.value==='Instagram'){
      const h=((ta.value+' '+(ht?ht.value:'')).match(/#\S+/g)||[]).length;
      if(h){t+=' · '+h+' hashtag'+(h===1?'':'s');if(h>30){t+=' (Instagram allows 30)';cls='over';}}
    }
    o.textContent=t;o.className='ccount'+(cls?' '+cls:'');
  };
  ta.addEventListener('input',upd);
  pl.addEventListener('change',upd);
  if(ht)ht.addEventListener('input',upd);
  upd();
}

function addDupNow(p){
  const dup=document.getElementById('dup');
  if(!dup||!p||!p.id||document.getElementById('dupnow'))return;
  dup.textContent='Duplicate and edit';
  const b=document.createElement('button');
  b.type='button';b.id='dupnow';b.textContent='Duplicate now';
  dup.insertAdjacentElement('afterend',b);
  b.onclick=async()=>{
    b.disabled=true;
    const row={client_id:p.client_id||cid,post_date:p.post_date,post_time:p.post_time,platform:p.platform,pillar:p.pillar,format:p.format,caption:p.caption,visual:p.visual,hashtags:p.hashtags,campaign:p.campaign,repost:false,status:'Draft',approval:'Pending'};
    const r=await sb.from('posts').insert(row).select('id').single();
    if(r.error){b.disabled=false;return alert('Could not duplicate: '+r.error.message);}
    document.getElementById('dlg').close();
    await loadPosts();adminView();
    toast('Post duplicated as a draft.',async()=>{
      const u=await sb.from('posts').delete().eq('id',r.data.id);
      if(u.error)return alert('Could not undo: '+u.error.message);
      await loadPosts();adminView();});
  };
}

const _postForm=postForm;
window.postForm=function(p){

};

let bdAll=false;
function boardView(){
  const L=stList(),y=month.getFullYear(),m=month.getMonth();
  const ps=posts.filter(p=>bdAll||inMonth(p,y,m));
  const extra=[...new Set(ps.map(p=>p.status||'Draft'))].filter(s=>!L.includes(s));

  <div class="board">${cols.map(colHtml).join('')}</div>
  <p style="color:var(--mute);font-size:13px">Drag a card to another column to change its status. Tap a card to open it.${STAGES?' Approval stage rules still apply.':''}</p></main>`;
  miniBind(boardView);
  addBoardBtn();
  const bp=document.getElementById('bpm'),bn=document.getElementById('bnm');
  if(bp)bp.onclick=()=>{month.setMonth(month.getMonth()-1);boardView();};
  if(bn)bn.onclick=()=>{month.setMonth(month.getMonth()+1);boardView();};
  document.getElementById('ball').onchange=e=>{bdAll=e.target.checked;boardView();};
  document.querySelectorAll('.bcard').forEach(c=>{
    c.draggable=true;
    c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id);
    c.onclick=()=>postForm(posts.find(p=>p.id===c.dataset.id));
  });
  document.querySelectorAll('.bcol').forEach(c=>{
    c.ondragover=e=>{e.preventDefault();c.classList.add('hot');};
    c.ondragleave=()=>c.classList.remove('hot');
    c.ondrop=async e=>{
      e.preventDefault();c.classList.remove('hot');
      const id=e.dataTransfer.getData('text/plain'),q=posts.find(x=>x.id===id),st=c.dataset.s;
      if(!q||(q.status||'Draft')===st)return;
      const prev=q.status||'Draft';
      const r=await sb.from('posts').update({status:st}).eq('id',id);
      if(r.error)return alert('Could not move: '+r.error.message);
      await loadPosts();boardView();
      toast('Moved to '+st+'.',async()=>{
        const u=await sb.from('posts').update({status:prev}).eq('id',id);
        if(u.error)return alert('Could not undo: '+u.error.message);
        await loadPosts();boardView();});
    };
  });
}

})();

body.adm header .menu,body.adm header #tl,body.adm header #out,body.adm header #vwb,body.adm header #rpb,body.adm header #yrb,body.adm header #icb,body.adm header #allb,body.adm header #insb,body.adm header #mlb,body.adm header #st,body.adm header #pr{display:none!important}

</style>
<script>
(function(){
'use strict';
const Q=s=>document.querySelector(s);
const NAV=[['month','▦','Calendar'],['week','▤','Week'],['list','☰','List'],['board','▥','Board'],['feed','▣','Feed'],['year','◷','Year'],['insights','◔','Insights'],['media','▨','Media'],['report','▭','Report'],['all','☷','All clients']];
const VIEWS=['month','week','list','board','feed'];
let mo=0;
const isAdm=()=>typeof me!=='undefined'&&me&&me.role==='admin';
const monOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
function go(v){vw=v;if(v==='week')wkStart=monOf(new Date());if(v==='year')yr=month.getFullYear();adminView();}

function side(force){
  let s=Q('#sbar');
  if(!isAdm()){document.body.classList.remove('adm');if(s)s.remove();return;}
  document.body.classList.add('adm');
  if(!s){s=document.createElement('nav');s.id='sbar';s.setAttribute('aria-label','Main');document.body.appendChild(s);
    s.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.v)return go(b.dataset.v);
      if(b.dataset.m){mo+=+b.dataset.m;return side(true);}
      if(b.dataset.d){const d=new Date(b.dataset.d+'T00:00');month=new Date(d.getFullYear(),d.getMonth(),1);mo=0;vw='week';wkStart=monOf(d);return adminView();}
      const a=b.dataset.a;
      if(a==='tools')toolsForm();else if(a==='set')settingsForm();else if(a==='ics')exportIcs();else if(a==='print')window.print();else if(a==='out')Q('#out').click();};}
  const sig=[vw,mo,month.getTime(),posts.length,cid].join('|');
  if(!force&&s.dataset.sig===sig)return;s.dataset.sig=sig;
  const base=new Date(month.getFullYear(),month.getMonth()+mo,1),st=monOf(base),td=iso(new Date());
  let cells='';for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);if(i>=35&&d.getMonth()!==base.getMonth())break;const ds=iso(d);
    cells+=`<button type="button" data-d="${ds}" class="${ds===td?'td':''}${d.getMonth()!==base.getMonth()?' of':''}${posts.some(p=>p.post_date===ds)?' hp':''}">${d.getDate()}</button>`;}
  s.innerHTML=`<div class="lo">${esc((clients.find(c=>c.id===cid)||{}).name||'Content Calendar')}</div>`
    +NAV.map(([v,i,l])=>`<button type="button" class="ni${vw===v?' on':''}" data-v="${v}"><i>${i}</i><span>${l}</span></button>`).join('')
    +`<hr><div class="mm"><div class="mh"><button type="button" data-m="-1" aria-label="Previous month">‹</button>${base.toLocaleString('en',{month:'short',year:'numeric'})}<button type="button" data-m="1" aria-label="Next month">›</button></div><div class="g7">${cells}</div></div><hr>`
    +[['tools','⚙','Tools'],['set','✎','Settings'],['ics','⇩','Calendar file'],['print','⎙','Print'],['out','↪','Log out']].map(([a,i,l])=>`<button type="button" class="ni" data-a="${a}"><i>${i}</i><span>${l}</span></button>`).join('');
}

function wgrid(){
  const m=Q('main'),anchor=m&&m.querySelector('.wd');if(!anchor||m.querySelector('.wg'))return;
  const days=[...Array(7)].map((_,i)=>{const d=new Date(wkStart);d.setDate(wkStart.getDate()+i);return d;}),td=iso(new Date());
  const cell=(d,hr)=>{const ds=iso(d),ps=posts.filter(p=>p.post_date===ds&&(hr==null?!p.post_time:p.post_time&&Math.min(22,Math.max(6,+p.post_time.slice(0,2)))===hr));
    return `<div class="wc" data-ds="${ds}" data-h="${hr==null?'':hr}">${ps.map(chipHtml).join('')}</div>`;};
  let h='<div class="wh"></div>'+days.map(d=>`<div class="wh${iso(d)===td?' t':''}">${d.toLocaleDateString('en',{weekday:'short',day:'numeric'})}</div>`).join('');
  h+='<div class="wt">No time</div>'+days.map(d=>cell(d,null)).join('');
  for(let hr=6;hr<=22;hr++)h+=`<div class="wt">${hr%12||12} ${hr<12?'AM':'PM'}</div>`+days.map(d=>cell(d,hr)).join('');
  const g=document.createElement('div');g.className='wg';g.innerHTML=h;anchor.before(g);
  const tm=w=>w.dataset.h?String(w.dataset.h).padStart(2,'0')+':00':null;
  g.onclick=e=>{const c=e.target.closest('.chip');if(c)return postForm(posts.find(p=>p.id===c.dataset.id));
    const w=e.target.closest('.wc');if(w)postForm({post_date:w.dataset.ds,post_time:tm(w)||undefined});};
  g.querySelectorAll('.chip').forEach(c=>{c.draggable=true;c.ondragstart=e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',c.dataset.id);};});
  g.querySelectorAll('.wc').forEach(w=>{w.ondragover=e=>e.preventDefault();
    w.ondrop=async e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(!posts.find(x=>x.id===id))return;
      const r=await sb.from('posts').update({post_date:w.dataset.ds,post_time:tm(w)}).eq('id',id);
      if(r.error)return alert('Could not move: '+r.error.message);await loadPosts();adminView();};});
}
const _wk=window.weekView;
window.weekView=function(){const r=_wk.apply(this,arguments);try{wgrid();}catch(e){console.error('ui',e);}return r;};

function comp(){
  const f=Q('#pf');if(!f||f.classList.contains('two'))return;
  const pv=Q('#pvw'),dt=pv&&pv.closest('details');if(!dt)return;
  dt.open=true;dt.querySelector('summary').textContent='Live preview';
  const l=document.createElement('div'),r=document.createElement('aside');l.className='fl';r.className='fr';
  [...f.children].forEach(c=>{if(c!==dt)l.appendChild(c);});r.appendChild(dt);f.append(l,r);f.classList.add('two');
  const sel=f.elements.namedItem('platform');if(!sel)return;
  const g=document.createElement('div');g.className='ptog';
  g.innerHTML=PLATFORMS.map(p=>`<button type="button" data-p="${esc(p)}" class="${sel.value===p?'on':''}">${picon(p)}${esc(p)}</button>`).join('');
  sel.style.display='none';sel.after(g);
  g.onclick=e=>{const b=e.target.closest('button');if(!b)return;sel.value=b.dataset.p;
    g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));};
}
const _pf=window.postForm;
window.postForm=function(){const r=_pf.apply(this,arguments);try{comp();}catch(e){console.error('ui',e);}return r;};

let dragId=null;
function feedDnd(){
  document.querySelectorAll('.fg button[data-id]').forEach(b=>{if(b.draggable)return;b.draggable=true;
    b.ondragstart=e=>{dragId=b.dataset.id;e.dataTransfer.setData('text/plain',dragId);};
    b.ondragover=e=>e.preventDefault();
    b.ondrop=async e=>{e.preventDefault();
      const a=posts.find(p=>p.id===dragId),c=posts.find(p=>p.id===b.dataset.id);if(!a||!c||a===c)return;
      const A={post_date:a.post_date,post_time:a.post_time},C={post_date:c.post_date,post_time:c.post_time};
      const r1=await sb.from('posts').update(C).eq('id',a.id),r2=await sb.from('posts').update(A).eq('id',c.id);
      if(r1.error||r2.error)return alert('Could not reorder: '+(r1.error||r2.error).message);
      await loadPosts();feedView();
      toast('Swapped the dates of two posts.',async()=>{await sb.from('posts').update(A).eq('id',a.id);await sb.from('posts').update(C).eq('id',c.id);await loadPosts();feedView();});};});
  const fg=Q('.fg');if(fg&&!Q('.hint'))fg.insertAdjacentHTML('afterend','<p class="hint">Drag a tile onto another one to swap their dates.</p>');
}

function enh(){
  side();
  if(!isAdm()){const c=Q('#cm > .card');if(c&&c.querySelector('.pc'))c.classList.add('rv');return;}
  const nx=Q('#nm')||Q('#nw');
  if(nx&&!Q('#tdy')){const b=document.createElement('button');b.type='button';b.id='tdy';b.textContent='Today';
    b.onclick=()=>{const n=new Date();month=new Date(n.getFullYear(),n.getMonth(),1);wkStart=monOf(n);adminView();};nx.after(b);}
  feedDnd();
}
let raf=0;
new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(enh);}).observe(Q('#app'),{childList:true,subtree:true});
enh();

/* click an empty day to add a post */
document.addEventListener('click',e=>{
  if(!isAdm()||Q('#dlg').open)return;
  const d=e.target.closest('.grid .day');if(!d||!d.dataset.date||e.target.closest('.chip,.more,button'))return;
  postForm({post_date:d.dataset.date});
});
/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const t=e.target,k=e.key;
  if(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable||Q('#dlg').open)return;
  if(isAdm()){
    if(k==='n'){e.preventDefault();postForm();}
    else if(k==='t'&&Q('#tdy'))Q('#tdy').click();
    else if(k==='ArrowLeft'){const b=Q('#pm')||Q('#pw');if(b)b.click();}
    else if(k==='ArrowRight'){const b=Q('#nm')||Q('#nw');if(b)b.click();}
    else if(k>='1'&&k<='5')go(VIEWS[+k-1]);
    else if(k==='?')toast('N new post · T today · ←/→ previous/next · 1-5 switch view');
  }else if(typeof me!=='undefined'&&me){
    const b=k==='ArrowLeft'?Q('#pv'):k==='ArrowRight'?Q('#nx'):null;if(b&&!b.disabled)b.click();
  }
});
})();
</script>

<!-- UI UPGRADE 2: command palette, insights charts, bulk edit, theme switch, client tour -->
<style>
html[data-theme=light]{--bg:#f6f5fa;--card:#fff;--ink:#1d2030;--mute:#6b6f85;--line:#e1e0ec;--acc:#4b3fd6;--accink:#fff;color-scheme:light}
html[data-theme=dark]{--bg:#14151f;--card:#1d1f2e;--ink:#eceefa;--mute:#9a9eb8;--line:#2d3047;--acc:#8d83ff;--accink:#14151f;color-scheme:dark}
#kov,.tov{position:fixed;inset:0;background:#0008;z-index:10000;display:flex;justify-content:center;align-items:flex-start;padding:12vh 12px 0}
.tov{align-items:center;padding:16px}.tov .card{max-width:380px}
#kbx{width:min(560px,94vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px #0006;overflow:hidden}

#kls button.on{background:var(--acc);color:var(--accink)}#kls small{opacity:.7}
.chip.selc{outline:3px solid var(--acc);outline-offset:1px}
#bkb2{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9000;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px 14px;box-shadow:0 10px 40px #0004;max-width:96vw}
#bkb2 select,#bkb2 input{width:auto}
@media(max-width:900px){#bkb2{bottom:72px}}
.hm{display:grid;grid-template-columns:36px repeat(17,minmax(14px,1fr));gap:2px;font-size:10px;color:var(--mute);overflow-x:auto}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--line)}

@media print{@page{margin:14mm}.stat,.wd,.ibar,.card,.insx{break-inside:avoid}h3{break-after:avoid}#bkb2,#kov,.tov,#thm{display:none!important}}
</style>
<script>
(function(){
'use strict';
const Q=s=>document.querySelector(s);
const isAdm=()=>typeof me!=='undefined'&&me&&me.role==='admin';
const monOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
const NAV=[['month','Calendar'],['week','Week'],['list','List'],['board','Board'],['feed','Feed'],['year','Year'],['insights','Insights'],['media','Media'],['report','Report'],['all','All clients']];
function go(v){vw=v;if(v==='week')wkStart=monOf(new Date());if(v==='year')yr=month.getFullYear();adminView();}

/* light / dark switch */
let T=null;try{T=localStorage.getItem('theme');}catch(e){}
const setT=t=>{const h=document.documentElement;t?h.setAttribute('data-theme',t):h.removeAttribute('data-theme');};
setT(window.__fd&&window.__fd()?"dark":T);
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  T=c==='dark'?'light':'dark';setT(T);try{localStorage.setItem('theme',T);}catch(e){}}

/* bulk select (month + week) */
let selMode=false;const selSet=new Set();
function markSel(){document.querySelectorAll('.chip[data-id]').forEach(c=>c.classList.toggle('selc',selSet.has(c.dataset.id)));bar();}
function bar(){let b=Q('#bkb2');
  if(!selMode||!isAdm()){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.id='bkb2';
    const op=(a,l)=>`<option value="">${l}…</option>`+a.map(x=>`<option>${esc(x)}</option>`).join('');
    b.innerHTML=`<b id="bkc2"></b><select id="bs" aria-label="Status">${op(STATUS_ALL,'Status')}</select><select id="bp" aria-label="Platform">${op(PLATFORMS,'Platform')}</select><select id="bi" aria-label="Pillar">${op(Object.keys(PILLARS),'Pillar')}</select><input id="bd" type="number" placeholder="Shift days" aria-label="Shift dates by days" style="width:110px"><button class="p" id="bgo" type="button">Apply</button><button id="bcl" type="button">Done</button>`;
    document.body.appendChild(b);
    Q('#bcl').onclick=toggleSel;
    Q('#bgo').onclick=async()=>{const ids=[...selSet];if(!ids.length)return alert('Click some posts first.');
      const u={};if(Q('#bs').value)u.status=Q('#bs').value;if(Q('#bp').value)u.platform=Q('#bp').value;if(Q('#bi').value)u.pillar=Q('#bi').value;
      const sh=parseInt(Q('#bd').value)||0;if(!Object.keys(u).length&&!sh)return alert('Choose something to change.');
      const prev=ids.map(id=>{const p=posts.find(x=>x.id===id)||{};return {id,status:p.status,platform:p.platform,pillar:p.pillar,post_date:p.post_date};});
      let err=null;
      if(Object.keys(u).length){const r=await sb.from('posts').update(u).in('id',ids);err=r.error;}
      if(!err&&sh)for(const p of prev){if(!p.post_date)continue;const r=await sb.from('posts').update({post_date:addDays(p.post_date,sh)}).eq('id',p.id);if(r.error){err=r.error;break;}}
      if(err)return alert('Could not update: '+err.message);
      selSet.clear();await loadPosts();adminView();
      toast('Updated '+ids.length+' post'+(ids.length===1?'':'s')+'.',async()=>{for(const p of prev)await sb.from('posts').update({status:p.status,platform:p.platform,pillar:p.pillar,post_date:p.post_date}).eq('id',p.id);await loadPosts();adminView();});};}
  Q('#bkc2').textContent=selSet.size+' selected';}
function toggleSel(){selMode=!selMode;if(!selMode){selSet.clear();const b=Q('#bkb2');if(b)b.remove();}
  document.body.classList.toggle('sel',selMode);const s=Q('#selb');if(s)s.textContent=selMode?'✓ Selecting':'☑ Select';markSel();}
document.addEventListener('click',e=>{
  if(!selMode||!isAdm()||Q('#dlg').open)return;
  const c=e.target.closest('.chip[data-id]');
  if(c&&(c.closest('.grid')||c.closest('.wg'))){e.preventDefault();e.stopPropagation();const id=c.dataset.id;selSet.has(id)?selSet.delete(id):selSet.add(id);markSel();return;}
  if(e.target.closest('.grid .day,.wg .wc')&&!e.target.closest('.more'))e.stopPropagation();
},true);

/* Insights: reach chart, pillar donut, posting heatmap */
function insX(){
  const m=Q('main');if(!m||m.querySelector('.insx'))return;
  const td=iso(new Date()),from=insRange==='30'?addDays(td,-30):insRange==='90'?addDays(td,-90):'';
  const rs=posts.filter(p=>p.reach!=null&&p.post_date&&(!from||p.post_date>=from)).sort((a,b)=>a.post_date.localeCompare(b.post_date));
  let h='<div class="insx">';
  if(rs.length>1){const W=700,H=180,P=28,mx=Math.max(1,...rs.map(p=>p.reach)),x=i=>P+i*(W-2*P)/(rs.length-1),y=v=>H-P-(v/mx)*(H-2*P);
    h+=`<h3>Reach over time</h3><div class="card" style="padding:10px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Reach per post over time"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${rs.map((p,i)=>x(i)+','+y(p.reach)).join(' ')}"/>${rs.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.reach)}" r="4" fill="var(--acc)"><title>${esc(p.post_date+' · '+p.platform+': '+p.reach)}</title></circle>`).join('')}<text x="${P}" y="14" font-size="11" fill="var(--mute)">${mx.toLocaleString()}</text><text x="${P}" y="${H-8}" font-size="11" fill="var(--mute)">${esc(rs[0].post_date)}</text><text x="${W-P}" y="${H-8}" font-size="11" text-anchor="end" fill="var(--mute)">${esc(rs[rs.length-1].post_date)}</text></svg></div>`;}
  const cnt={};posts.forEach(p=>{if(p.pillar)cnt[p.pillar]=(cnt[p.pillar]||0)+1;});const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
  if(tot){let a=0;const seg=Object.entries(cnt).map(([k,n])=>{const s=a;a+=n/tot*100;return `${safeCol(PILLARS[k])} ${s}% ${a}%`;});
    h+=`<h3>Content pillar mix (all posts)</h3><div class="row" style="gap:20px"><div class="donut" style="background:conic-gradient(${seg.join(',')})" role="img" aria-label="Pillar mix"></div><div>${Object.entries(cnt).map(([k,n])=>`<div><span class="pd" style="background:${safeCol(PILLARS[k])}"></span>${esc(k)} · ${n} (${Math.round(n/tot*100)}%)</div>`).join('')}</div></div>`;}
  const hm={};let hx=0;
  posts.forEach(p=>{if(!p.post_date||!p.post_time)return;const d=(new Date(p.post_date+'T00:00').getDay()+6)%7,hr=Math.min(22,Math.max(6,+p.post_time.slice(0,2))),k=d+'-'+hr;hm[k]=(hm[k]||0)+1;hx=Math.max(hx,hm[k]);});
  if(hx){let g='<span></span>';for(let hr=6;hr<=22;hr++)g+=`<span style="text-align:center">${hr%12||12}${hr<12?'a':'p'}</span>`;
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((dn,d)=>{g+=`<span>${dn}</span>`;for(let hr=6;hr<=22;hr++){const n=hm[d+'-'+hr]||0;g+=`<i title="${dn} ${hr}:00 · ${n} post${n===1?'':'s'}"${n?` style="background:color-mix(in srgb,var(--acc) ${20+Math.round(n/hx*80)}%,var(--card))"`:''}></i>`;}});
    h+=`<h3>When you post (all posts)</h3><div class="tw" style="padding:10px"><div class="hm">${g}</div></div>`;}

/* Ctrl+K palette */

      .forEach(p=>items.push([(p.post_date||'')+' · '+(p.platform||'')+' — '+(p.caption||'(no caption)').slice(0,50),'Post',()=>{if(isAdm())postForm(p);else{lv=false;idx=posts.indexOf(p);clientView();}}]));
    cur=Math.min(cur,Math.max(0,items.length-1));
    ls.innerHTML=items.map((it,i)=>`<button type="button" data-i="${i}" class="${i===cur?'on':''}"><span>${esc(it[0])}</span><small>${it[1]}</small></button>`).join('')||'<div style="padding:14px;color:var(--mute)">No matches</div>';};
  inp.oninput=()=>{cur=0;draw();};
  inp.onkeydown=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowDown'){e.preventDefault();cur=Math.min(items.length-1,cur+1);draw();}

  o.onclick=e=>{if(e.target===o)close();};

}

<script>
(function(){
'use strict';
const Q=s=>document.querySelector(s);
const isAdm=()=>typeof me!=='undefined'&&me&&me.role==='admin';
const monOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
const dAdd=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}return null;};
const h12=h=>(h%12||12)+':00 '+(h<12?'AM':'PM');
const copy=async t=>{try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}toast('Copied.');};

/* ---- holidays ---- */
const HC={};
function hol(y){if(HC[y])return HC[y];const m={},P=n=>String(n).padStart(2,'0'),add=(mo,dd,n)=>{const k=y+'-'+P(mo)+'-'+P(dd);(m[k]=m[k]||[]).push(n);};
  const nth=(mo,dow,n)=>1+((dow-new Date(y,mo-1,1).getDay()+7)%7)+(n-1)*7,last=(mo,dow)=>{const l=new Date(y,mo,0);return l.getDate()-((l.getDay()-dow+7)%7);};
  add(1,1,"New Year's Day");add(1,nth(1,1,3),'MLK Day');add(2,14,"Valentine's Day");add(2,nth(2,1,3),"Presidents' Day");add(3,17,"St. Patrick's Day");
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451);
  add(Math.floor((h+l-7*mm+114)/31),((h+l-7*mm+114)%31)+1,'Easter');
  add(4,22,'Earth Day');add(5,nth(5,0,2),"Mother's Day");add(5,last(5,1),'Memorial Day');add(6,nth(6,0,3),"Father's Day");add(6,19,'Juneteenth');add(7,4,'Independence Day');add(9,nth(9,1,1),'Labor Day');add(10,31,'Halloween');add(11,11,'Veterans Day');
  const tg=nth(11,4,4);add(11,tg,'Thanksgiving');add(11,tg+1,'Black Friday');add(12,24,'Christmas Eve');add(12,25,'Christmas Day');add(12,31,"New Year's Eve");
  return HC[y]=m;}

/* ---- gaps + fill month ---- */
function plan(y,mo){
  const today=iso(new Date()),last=new Date(y,mo+1,0),out=[];
  for(let ws=monOf(new Date(y,mo,1));ws<=last;ws=dAdd(ws,7)){
    const a=iso(ws),b=iso(dAdd(ws,6)),wk=[...Array(7)].map((_,i)=>dAdd(ws,i)).filter(d=>d.getMonth()===mo),inM=wk.filter(d=>iso(d)>=today);
    if(!inM.length)continue;
    let days=inM.filter(d=>d.getDay()%6!==0);if(!days.length)days=inM;
    PLATFORMS.forEach(pl=>{const goal=GOALS[pl]||0;if(!goal)return;
      const need=Math.ceil(goal*wk.length/7),have=posts.filter(p=>p.platform===pl&&p.post_date>=a&&p.post_date<=b).length,short=need-have;
      for(let k=0;k<short;k++){let j=Math.floor((k+.5)*days.length/short),t=0,ds;
        do{ds=iso(days[(j+t)%days.length]);t++;}while(t<days.length&&(posts.some(p=>p.platform===pl&&p.post_date===ds)||out.some(o=>o.platform===pl&&o.date===ds)));
        out.push({date:ds,platform:pl,week:a,wend:b});}});
  }
  return out;}
async function fillMonth(){
  const pl=plan(month.getFullYear(),month.getMonth());
  if(!pl.length)return alert('This month already meets your weekly goals (or has no days left).');
  if(!confirm('Create '+pl.length+' empty draft posts to reach your weekly goals?'))return;
  const keys=Object.keys(PILLARS);
  const rows=pl.map((o,i)=>({client_id:cid,post_date:o.date,platform:o.platform,pillar:keys[i%keys.length],format:'Static Photo',status:'Draft',approval:'Pending'}));
  const r=await sb.from('posts').insert(rows).select('id');if(r.error)return alert('Could not create: '+r.error.message);
  const ids=(r.data||[]).map(x=>x.id);await loadPosts();adminView();
  toast('Added '+rows.length+' drafts.',async()=>{await sb.from('posts').delete().in('id',ids);await loadPosts();adminView();});}
function gaps(){
  const g=Q('.grid');if(!g||Q('.insg'))return;
  const pl=plan(month.getFullYear(),month.getMonth()),by={};
  pl.forEach(o=>{(by[o.week]=by[o.week]||{end:o.wend,items:{}}).items[o.platform]=(by[o.week].items[o.platform]||[]).concat(o.date);});
  const f=s=>new Date(s+'T00:00').toLocaleDateString('en',{month:'short',day:'numeric'});
  g.insertAdjacentHTML('afterend',`<div class="card insg" style="margin:12px 0;padding:12px"><div class="row"><b>Gaps against your weekly goals</b><span style="color:var(--mute);font-size:13px;flex:1">${pl.length?pl.length+' post'+(pl.length===1?'':'s')+' short':''}</span>${pl.length?'<button type="button" class="p gbtn" id="fillm">Fill month with drafts</button>':''}</div>`
    +(Object.entries(by).map(([w,v])=>`<div class="cm"><b>${f(w)} – ${f(v.end)}</b> · ${Object.entries(v.items).map(([p,ds])=>`<button type="button" class="gbtn" data-ds="${ds[0]}" data-pl="${esc(p)}">＋ ${esc(p)}${ds.length>1?' ×'+ds.length:''}</button>`).join('')}</div>`).join('')||'<div style="color:var(--mute);margin-top:6px">All remaining weeks meet your goals ✓</div>')+'</div>');
  document.querySelectorAll('.gbtn[data-ds]').forEach(b=>b.onclick=()=>postForm({post_date:b.dataset.ds,platform:b.dataset.pl}));
  if(Q('#fillm'))Q('#fillm').onclick=fillMonth;}

/* ---- calendar as PNG, copy week ---- */
function png(){
  const y=month.getFullYear(),mo=month.getMonth(),first=new Date(y,mo,1),off=(first.getDay()+6)%7,wks=Math.ceil((off+new Date(y,mo+1,0).getDate())/7);
  const W=1400,hd=120,cw=W/7,ch=170,H=hd+28+wks*ch+16,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d'),F='system-ui,sans-serif';
  const fit=(t,mw)=>{t=String(t||'');if(x.measureText(t).width<=mw)return t;while(t.length>1&&x.measureText(t+'…').width>mw)t=t.slice(0,-1);return t+'…';};
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle=BRAND||'#4b3fd6';x.fillRect(0,0,W,8);
  x.fillStyle='#1d2030';x.font='700 34px '+F;x.fillText(((clients.find(c=>c.id===cid)||{}).name||'')+' · '+month.toLocaleString('en',{month:'long',year:'numeric'}),30,66);
  x.fillStyle='#6b6f85';x.font='16px '+F;x.fillText('Social media content calendar',30,96);
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((n,i)=>x.fillText(n,i*cw+10,hd+18));
  for(let i=0;i<wks*7;i++){const d=dAdd(first,i-off),cx=(i%7)*cw,cy=hd+28+Math.floor(i/7)*ch,ds=iso(d),inm=d.getMonth()===mo;
    x.strokeStyle='#e1e0ec';x.strokeRect(cx,cy,cw,ch);x.fillStyle=inm?'#1d2030':'#b0b3c4';x.font='700 15px '+F;x.fillText(d.getDate(),cx+8,cy+20);
    const ps=posts.filter(p=>p.post_date===ds);x.font='13px '+F;
    ps.slice(0,4).forEach((p,j)=>{const yy=cy+30+j*30;x.fillStyle=safeCol(PILLARS[p.pillar]);x.fillRect(cx+6,yy,4,24);x.fillStyle='#1d2030';x.fillText(fit(p.platform,cw-26),cx+14,yy+10);x.fillStyle='#6b6f85';x.fillText(fit((p.post_time?p.post_time.slice(0,5)+' ':'')+(p.caption||''),cw-26),cx+14,yy+23);});
    if(ps.length>4){x.fillStyle='#6b6f85';x.fillText('+'+(ps.length-4)+' more',cx+10,cy+ch-8);}}
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=((clients.find(c=>c.id===cid)||{}).name||'calendar').replace(/[^\w-]+/g,'_')+'_'+y+'-'+String(mo+1).padStart(2,'0')+'.png';document.body.appendChild(a);a.click();a.remove();});}
function copyWeek(){
  const days=[...Array(7)].map((_,i)=>dAdd(wkStart,i));
  copy(days.map(d=>{const ds=iso(d),ps=posts.filter(p=>p.post_date===ds).sort((a,b)=>(a.post_time||'').localeCompare(b.post_time||''));
    return d.toLocaleDateString('en',{weekday:'long',month:'short',day:'numeric'})+'\n'+(ps.map(p=>'  '+(p.post_time?p.post_time.slice(0,5)+' ':'')+p.platform+' — '+(p.caption||'(no caption)').replace(/\s+/g,' ')).join('\n')||'  Nothing planned');}).join('\n\n'));}

/* ---- platform previews: "…more" ---- */
const CUT={Instagram:125,Facebook:300,LinkedIn:210,TikTok:100,'Google Business Profile':200};

/* ---- composer extras: drafts, copy, best time ---- */
function bestFor(pl){const a=posts.filter(p=>p.platform===pl&&p.post_time);if(a.length<3)return null;
  const wr=a.filter(p=>p.reach!=null),by=(arr,f)=>{const g={};arr.forEach(p=>{const h=+p.post_time.slice(0,2);(g[h]=g[h]||[]).push(f(p));});return Object.entries(g).map(([h,v])=>[+h,v]);};
  if(wr.length>=3){const b=by(wr,p=>p.reach).map(([h,v])=>[h,v.reduce((s,n)=>s+n,0)/v.length]).sort((x,y)=>y[1]-x[1])[0];return {h:b[0],why:'highest average reach'};}
  const b=by(a,p=>1).sort((x,y)=>y[1].length-x[1].length)[0];return {h:b[0],why:'your most used time'};}
const DF=['post_date','post_time','platform','pillar','format','status','campaign','caption','visual','hashtags','notes'];
const dlg=Q('#dlg');
dlg.addEventListener('close',()=>{if(window.__dok&&Date.now()-window.__dok.t<8000)ls(window.__dok.k,null);window.__dok=null;});

function extras(p){
  const f=Q('#pf');if(!f||f.dataset.x3)return;f.dataset.x3='1';p=p||{};
  const key='draft:'+cid+':'+(p.id||'new');
  /* copy */
  const cx=Q('#cx');if(cx){const b=document.createElement('button');b.type='button';b.textContent='Copy caption';b.onclick=()=>copy((f.caption.value+(f.hashtags.value?'\n\n'+f.hashtags.value:'')).trim());cx.after(b);}
  /* best time */
  const mn=Q('#mn');if(mn){const bt=document.createElement('div');bt.id='bth';mn.after(bt);
    const upd=()=>{const r=bestFor(f.platform.value);bt.innerHTML=r?`Tip: ${esc(f.platform.value)} · ${h12(r.h)} (${r.why}) <button type="button" id="usebt">Use</button>`:'';
      if(r)Q('#usebt').onclick=()=>{f.post_time.value=String(r.h).padStart(2,'0')+':00';f.post_time.dispatchEvent(new Event('change',{bubbles:true}));};};
    f.platform.addEventListener('change',upd);upd();}
  /* drafts */
  let d=null;try{d=JSON.parse(ls(key)||'null');}catch(e){}
  const meaningful=o=>o&&(o.caption||o.hashtags||o.notes||o.visual);
  if(meaningful(d)){const w=document.createElement('div');w.className='warn';
    w.innerHTML=`Unsaved draft from ${esc(new Date(d.t).toLocaleString())}. <button type="button" id="drr">Restore</button> <button type="button" id="drd">Discard</button>`;
    f.querySelector('h2').after(w);
    Q('#drd').onclick=()=>{ls(key,null);w.remove();};
    Q('#drr').onclick=()=>{DF.forEach(n=>{const el=f.elements.namedItem(n);if(!el||d[n]==null)return;
      if(n==='platform'){const b=f.querySelector('.ptog button[data-p="'+d[n].replace(/"/g,'')+'"]');if(b){b.click();return;}}
      el.value=d[n];el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));});w.remove();};}
  f.addEventListener('input',()=>{const o={t:Date.now()};DF.forEach(n=>{const el=f.elements.namedItem(n);if(el)o[n]=el.value;});if(meaningful(o))ls(key,JSON.stringify(o));});
  f.addEventListener('submit',()=>{window.__dok={k:key,t:Date.now()};});
}
const _pf=window.postForm;
window.postForm=function(p){const r=_pf.apply(this,arguments);try{extras(p);}catch(e){console.error('ui3',e);}return r;};

/* ---- density / text size ---- */

function enh(){

    if(g){gaps();

          b.onclick=()=>postForm({post_date:ds,caption:'Happy '+n+'! ',status:'Draft'});sp&&sp.after(b);});});}
  }
  document.querySelectorAll('.pace .stat:not([data-rg])').forEach(s=>{s.dataset.rg='1';const b=s.querySelector('b'),m=b&&b.textContent.match(/^(\d+) \/ (\d+)$/);if(!m)return;
    const n=+m[1],t=+m[2],pc=t?Math.min(1,n/t):0;s.classList.add('rg');
    s.innerHTML=`<svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="${n} of ${t}"><circle cx="20" cy="20" r="16" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="${t&&n>=t?'#177a4e':'var(--acc)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(pc*100.5).toFixed(1)} 100.5" transform="rotate(-90 20 20)"/></svg><div>${s.innerHTML}</div>`;});
  document.querySelectorAll('.chip[data-id]:not([aria-label])').forEach(c=>c.setAttribute('aria-label',(c.title||'Post')+': '+((c.querySelector('.cl2')||{}).textContent||'no caption')));
}
let raf=0;
new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(enh);}).observe(Q('#app'),{childList:true,subtree:true});

enh();

})();

<!-- UI UPGRADE 4: pre-flight, recently deleted, find & replace, next-week copy, pillar targets, snippets, hashtag insights, grid planner, UTM, approval sheet, recap, backup, shortcuts, setup checklist -->
<style>

<script>
(function(){
'use strict';
const Q=s=>document.querySelector(s);

const dAdd=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const get=(k,def)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?def:v;}catch(e){return def;}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();};
const cname=()=>(clients.find(c=>c.id===cid)||{}).name||'';
function dlgOpen(html){const d=Q('#dlg');d.innerHTML=html+'<div class="row" style="margin-top:14px"><button type="button" id="cx">Close</button></div>';if(!d.open)d.showModal();Q('#cx').onclick=()=>d.close();return d;}
const muted=t=>`<p style="color:var(--mute)">${t}</p>`;

/* ---- pre-flight ---- */
const LIM={Instagram:2200,TikTok:4000,LinkedIn:3000,'Google Business Profile':1500,Facebook:63206};
function pre(p){const a=[],cap=p.caption||'';
  if(!cap.trim())a.push('Caption missing');
  if(!p.visual&&p.format!=='Text Only')a.push('No photo or video');
  if(!p.post_time)a.push('No time set');
  if(!p.hashtags&&!/#\S/.test(cap)&&/^(Instagram|TikTok)$/.test(p.platform))a.push('No hashtags');
  if(LIM[p.platform]&&[...cap].length>LIM[p.platform])a.push('Caption too long for '+p.platform);
  if(p.platform==='Instagram'&&((cap+' '+(p.hashtags||'')).match(/#\S+/g)||[]).length>30)a.push('Over 30 hashtags');
  if(!p.pillar)a.push('No content pillar');
  return a;}

/* ---- recently deleted ---- */
let cur=null;
document.addEventListener('click',e=>{if(!e.target.closest('#del')||!cur||!cur.id)return;const k='trash:'+cid,a=get(k,[]).filter(x=>x.p.id!==cur.id);a.unshift({t:Date.now(),p:cur});put(k,a.slice(0,30));},true);
function trashForm(){const a=get('trash:'+cid,[]);
  const d=dlgOpen('<h2 style="margin-top:0">Recently deleted</h2>'+(a.map((x,i)=>`<div class="cm"><b>${esc(x.p.post_date||'No date')} · ${esc(x.p.platform||'')}</b><div>${esc((x.p.caption||'(no caption)').slice(0,100))}</div><small>Deleted ${esc(new Date(x.t).toLocaleString())}</small> <button type="button" class="p" data-r="${i}" style="min-height:0;padding:2px 10px">Restore</button></div>`).join('')||muted('Nothing deleted recently. Posts you delete are kept here, in this browser, so you can bring them back.')));
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.r,row={...a[i].p};['id','created_at','updated_at'].forEach(k=>delete row[k]);row.client_id=cid;
    const r=await sb.from('posts').insert(row);if(r.error)return alert('Could not restore: '+r.error.message);
    a.splice(i,1);put('trash:'+cid,a);d.close();await loadPosts();adminView();toast('Post restored.');});}

/* ---- find and replace ---- */
function frForm(){
  const F=['caption','hashtags','campaign','notes'],lab=t=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="${t[0]}" style="width:auto">${t[1]}</label>`;
  const d=dlgOpen(`<h2 style="margin-top:0">Find and replace</h2><p style="color:var(--mute);margin:0">Searches captions, hashtags, campaign and notes for ${esc(cname())}.</p><label>Find</label><input id="fri"><label>Replace with</label><input id="fro">${lab(['frc','Match case'])}${lab(['frp','Skip posts already Posted'])}<div id="frs" style="margin:10px 0"></div><button type="button" class="p" id="frg" disabled>Replace</button>`);
  let hits=[];
  const calc=()=>{const f=Q('#fri').value;hits=[];
    if(f){const re=new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),Q('#frc').checked?'g':'gi'),rp=Q('#fro').value;
      posts.forEach(p=>{if(Q('#frp').checked&&p.status==='Posted')return;const u={},old={};F.forEach(k=>{const v=p[k];if(!v)return;const nv=v.replace(re,()=>rp);if(nv!==v){u[k]=nv;old[k]=v;}});if(Object.keys(u).length)hits.push({p,u,old});});}
    Q('#frs').innerHTML=!f?'':hits.length?`<b>${hits.length}</b> post${hits.length===1?'':'s'} will change.`+hits.slice(0,5).map(h=>`<div class="cm"><small>${esc(h.p.post_date||'')}</small> ${esc(Object.values(h.u)[0].slice(0,100))}</div>`).join(''):'No matches.';
    Q('#frg').disabled=!hits.length;};
  ['fri','fro','frc','frp'].forEach(i=>Q('#'+i).oninput=calc);
  Q('#frg').onclick=async()=>{if(!confirm('Change '+hits.length+' posts?'))return;let bad=null;
    for(let i=0;i<hits.length&&!bad;i+=8)await Promise.all(hits.slice(i,i+8).map(async h=>{const r=await sb.from('posts').update(h.u).eq('id',h.p.id);if(r.error)bad=r.error;}));
    const snap=hits.slice();d.close();await loadPosts();adminView();
    if(bad)return alert('Some posts could not be changed: '+bad.message);
    toast('Changed '+snap.length+' posts.',async()=>{for(const h of snap)await sb.from('posts').update(h.old).eq('id',h.p.id);await loadPosts();adminView();});};}

/* ---- copy week to next week ---- */
async function nextWeek(){
  const a=iso(wkStart),b=iso(dAdd(wkStart,6)),src=posts.filter(p=>p.post_date>=a&&p.post_date<=b);
  if(!src.length)return alert('This week has no posts.');if(!confirm('Copy '+src.length+' posts to next week as drafts?'))return;
  const rows=src.map(p=>({client_id:cid,post_date:addDays(p.post_date,7),post_time:p.post_time,platform:p.platform,pillar:p.pillar,format:p.format,caption:p.caption,visual:p.visual,hashtags:p.hashtags,campaign:p.campaign,repost:false,status:'Draft',approval:'Pending'}));
  const r=await sb.from('posts').insert(rows).select('id');if(r.error)return alert('Could not copy: '+r.error.message);
  const ids=(r.data||[]).map(x=>x.id);wkStart=dAdd(wkStart,7);await loadPosts();adminView();
  toast('Copied '+rows.length+' posts to this week.',async()=>{await sb.from('posts').delete().in('id',ids);await loadPosts();adminView();});}

/* ---- caption snippets ---- */
function snipForm(){const k='snip:'+cid,a=get(k,[]);
  const d=dlgOpen(`<h2 style="margin-top:0">Caption snippets</h2>${a.map((s,i)=>`<div class="cm"><b>${esc(s.n)}</b><div style="white-space:pre-wrap;color:var(--mute);font-size:13px">${esc(s.t)}</div><button type="button" class="bad" data-x="${i}" style="min-height:0;padding:2px 10px">Delete</button></div>`).join('')||muted('No snippets yet.')}<form id="snf"><label>Name</label><input name="n" required placeholder="e.g. Business hours"><label>Text</label><textarea name="t" rows="3" required></textarea><button class="p" style="margin-top:8px">Add snippet</button></form>${muted('Saved in this browser for '+esc(cname())+'. They appear in the composer under the caption.')}`);
  d.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.x,1);put(k,a);snipForm();});
  Q('#snf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);a.push({n:f.get('n').trim(),t:f.get('t')});put(k,a);snipForm();};}

/* ---- composer extras ---- */
function ext(p){
  const f=Q('#pf');if(!f||f.dataset.x4)return;f.dataset.x4='1';p=p||{};
  const v=n=>(f.elements.namedItem(n)||{}).value||'',snap=()=>({caption:v('caption'),visual:v('visual'),post_time:v('post_time'),hashtags:v('hashtags'),platform:v('platform'),format:v('format'),pillar:v('pillar')});
  const fr=Q('#pf .fr');
  if(fr){const pn=document.createElement('div');pn.className='card';pn.style.cssText='padding:10px;margin-top:10px';fr.appendChild(pn);
    const upd=()=>{const is=pre(snap());pn.innerHTML=is.length?'<b>Needs work</b>'+is.map(i=>`<div style="color:#c2410c;font-size:13px">✗ ${esc(i)}</div>`).join(''):'<b style="color:#177a4e">✓ Ready to send</b>';};
    f.addEventListener('input',upd);f.addEventListener('change',upd);upd();}
  f.addEventListener('submit',e=>{const st=v('status');if(!/^(Client review|Approved|Scheduled)$/.test(st))return;const is=pre(snap());
    if(is.length&&!confirm('This post is not fully ready:\n• '+is.join('\n• ')+'\n\nSave it as '+st+' anyway?')){e.preventDefault();e.stopImmediatePropagation();}},true);
  const sn=get('snip:'+cid,[]),ta=f.elements.namedItem('caption');
  if(sn.length&&ta){const s=document.createElement('select');s.style.marginTop='6px';s.setAttribute('aria-label','Insert a saved snippet');
    s.innerHTML='<option value="">Insert a snippet…</option>'+sn.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join('');
    s.onchange=()=>{if(s.value==='')return;ta.setRangeText(sn[+s.value].t,ta.selectionStart,ta.selectionEnd,'end');s.value='';ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();};
    (Q('#ccount')||ta).after(s);}
  const nt=f.elements.namedItem('notes'),nl=nt&&nt.previousElementSibling;
  if(nl){const det=document.createElement('details');det.style.marginTop='10px';
    det.innerHTML=`<summary style="cursor:pointer">Tracking link (UTM)</summary><label>Page address</label><input id="utb" placeholder="https://yourclient.com/offer"><div class="row" style="margin-top:8px"><button type="button" id="utg">Build link</button><button type="button" id="utc">Copy</button></div><label>Tracking link</label><input id="utr" value="${esc(p.tracking_url||'')}"${p.tracking_url?' name="tracking_url"':''}>`;
    nl.before(det);
    const SRC={'Google Business Profile':'google'},slug=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    Q('#utg').onclick=()=>{let u;try{u=new URL(Q('#utb').value.trim());}catch(e){return alert('Type the full page address, starting with https://');}
      const pl=v('platform');u.searchParams.set('utm_source',SRC[pl]||slug(pl));u.searchParams.set('utm_medium','social');u.searchParams.set('utm_campaign',slug(v('campaign')||v('pillar'))||'social');if(v('post_date'))u.searchParams.set('utm_content',v('post_date'));
      Q('#utr').value=u.toString();Q('#utr').name='tracking_url';};
    Q('#utc').onclick=()=>{const t=Q('#utr').value;if(t){try{navigator.clipboard.writeText(t);}catch(e){}toast('Copied.');}};}
}
const _pf=window.postForm;
window.postForm=function(p){cur=p||null;const r=_pf.apply(this,arguments);try{ext(p);}catch(e){console.error('ui4',e);}return r;};

/* ---- Insights: pillar targets + hashtags ---- */
function insY(){
  const m=Q('main');if(!m||m.querySelector('.insy'))return;
  const td=iso(new Date()),from=insRange==='30'?addDays(td,-30):insRange==='90'?addDays(td,-90):'',ps=posts.filter(p=>!from||(p.post_date&&p.post_date>=from));
  const tk='ptarget:'+cid,T=get(tk,{}),keys=Object.keys(PILLARS),cnt={};ps.forEach(p=>{if(p.pillar)cnt[p.pillar]=(cnt[p.pillar]||0)+1;});
  const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
  const row=k=>{const act=tot?Math.round((cnt[k]||0)/tot*100):0,t=T[k],has=t!=null&&t!=='';
    const df=!has?'':act-t>5?'over by '+(act-t)+' pts':t-act>5?'under by '+(t-act)+' pts':'on target';
    return `<tr><td><span class="pd" style="background:${safeCol(PILLARS[k])}"></span>${esc(k)}</td><td><input type="number" min="0" max="100" data-pt="${esc(k)}" value="${has?t:''}" style="width:80px" aria-label="Target percent for ${esc(k)}"></td><td>${act}%</td><td style="width:34%"><div class="ibar" style="position:relative;overflow:visible"><div style="width:${act}%"></div>${has?`<i style="position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:${Math.min(100,t)}%"></i>`:''}</div></td><td>${df}</td></tr>`;};
  const H={};ps.forEach(p=>{new Set(((p.hashtags||'')+' '+(p.caption||'')).toLowerCase().match(/#[\p{L}\p{N}_]+/gu)||[]).forEach(t=>{const o=H[t]=H[t]||{n:0,r:0,rn:0};o.n++;if(p.reach!=null){o.r+=p.reach;o.rn++;}});});
  const ha=Object.entries(H),use=ha.slice().sort((a,b)=>b[1].n-a[1].n).slice(0,10),rch=ha.filter(([,o])=>o.rn>=2).sort((a,b)=>b[1].r/b[1].rn-a[1].r/a[1].rn).slice(0,5);
  const ht=(arr,c3)=>arr.length?`<div class="tw"><table class="lt"><thead><tr><th>Hashtag</th><th>Posts</th><th>${c3}</th></tr></thead><tbody>${arr.map(([t,o])=>`<tr><td>${esc(t)}</td><td>${o.n}</td><td>${o.rn?Math.round(o.r/o.rn).toLocaleString():'–'}</td></tr>`).join('')}</tbody></table></div>`:muted('Not enough data yet.');
  const h=`<div class="insy"><h3>Pillar targets</h3><div class="tw"><table class="lt"><thead><tr><th>Pillar</th><th>Target %</th><th>Actual</th><th></th><th></th></tr></thead><tbody>${keys.map(row).join('')}</tbody></table></div><p style="color:var(--mute);font-size:13px;margin:4px 0">Targets are saved in this browser. Actual share uses the period chosen above.</p>
  <h3>Hashtags</h3><div class="g2"><div><b>Most used</b>${ht(use,'Avg reach')}</div><div><b>Best average reach</b> <small style="color:var(--mute)">(2+ posts with results)</small>${ht(rch,'Avg reach')}</div></div></div>`;
  const x=m.querySelector('.insx'),t=[...m.querySelectorAll('h3')].find(e=>/Top posts/.test(e.textContent));
  x?x.insertAdjacentHTML('afterend',h):t?t.insertAdjacentHTML('beforebegin',h):m.insertAdjacentHTML('beforeend',h);
  m.querySelectorAll('[data-pt]').forEach(i=>i.onchange=()=>{T[i.dataset.pt]=i.value===''?null:+i.value;put(tk,T);m.querySelector('.insy').remove();insY();});}
const _ins=window.insightsView;
window.insightsView=function(){const r=_ins.apply(this,arguments);try{insY();}catch(e){console.error('ui4',e);}return r;};

/* ---- Instagram grid planner ---- */
let igF='all';
function igx(){const fg=Q('.fg');if(!fg||Q('#igf'))return;
  fg.insertAdjacentHTML('beforebegin',`<div class="row noprint" id="igf" style="justify-content:center;margin:10px 0"><div class="seg">${[['all','All'],['up','Upcoming'],['live','Posted']].map(([v,l])=>`<button type="button" data-f="${v}" class="${igF===v?'on':''}">${l}</button>`).join('')}</div><span style="color:var(--mute);font-size:13px">Dashed tiles are planned posts; solid tiles are already posted.</span></div>`);
  const apply=()=>fg.querySelectorAll('button[data-id]').forEach(b=>{const p=posts.find(x=>x.id===b.dataset.id)||{},up=p.status!=='Posted';b.classList.toggle('up',up);
    if(!b.dataset.t){b.dataset.t='1';const s=b.querySelector('span');if(s)s.textContent+=up?' · Planned':' · Posted';}
    b.style.display=(igF==='up'&&!up)||(igF==='live'&&up)?'none':'';});
  Q('#igf').onclick=e=>{const b=e.target.closest('button[data-f]');if(!b)return;igF=b.dataset.f;Q('#igf').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));apply();};apply();}
const _fv=window.feedView;
window.feedView=function(){const r=_fv.apply(this,arguments);try{igx();}catch(e){console.error('ui4',e);}return r;};

/* ---- approval sheet, recap, backup, shortcuts ---- */
const mPosts=()=>{const y=month.getFullYear(),mo=month.getMonth();return posts.filter(p=>inMonth(p,y,mo)).sort((a,b)=>(a.post_date+(a.post_time||'')).localeCompare(b.post_date+(b.post_time||'')));};
const mTitle=()=>month.toLocaleString('en',{month:'long',year:'numeric'});
function sheet(){
  const ps=mPosts();if(!ps.length)return alert('No posts in '+mTitle()+'. Use the month view first.');
  const w=window.open('','_blank');if(!w)return alert('Allow pop-ups for this site to open the print page.');
  const css='body{font:14px system-ui,sans-serif;margin:24px;color:#1d2030}h1{margin:0 0 4px}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.c{border:1px solid #ccc;border-radius:10px;padding:12px;break-inside:avoid}.c img{width:100%;max-height:220px;object-fit:cover;border-radius:6px}.m{color:#666;font-size:12px}.b{margin-top:8px;font-size:13px}';
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(cname())} ${esc(mTitle())} approval sheet</title><style>${css}</style><h1>${esc(cname())}: ${esc(mTitle())}</h1><div class="m">Content for approval · prepared ${esc(new Date().toLocaleDateString('en',{day:'numeric',month:'long',year:'numeric'}))}</div><div class="g">${ps.map(p=>{const t=thumbUrl(p.visual,'w500');return `<div class="c">${t?`<img src="${t}" alt="">`:''}<div class="m"><b>${esc(p.post_date)}${p.post_time?' · '+esc(p.post_time.slice(0,5)):''}</b> · ${esc(p.platform)} · ${esc(p.pillar||'')}</div><div style="white-space:pre-wrap;margin-top:6px">${esc(p.caption||'(no caption yet)')}</div>${p.hashtags?`<div class="m">${esc(p.hashtags)}</div>`:''}<div class="b">☐ Approved &nbsp;&nbsp; ☐ Changes: ______________________</div></div>`;}).join('')}</div>`);
  w.document.close();setTimeout(()=>w.print(),900);}
function recap(){
  const ps=mPosts(),cn=s=>ps.filter(p=>p.status===s).length,tot=k=>ps.reduce((a,p)=>a+(+p[k]||0),0);
  const pl=PLATFORMS.map(x=>[x,ps.filter(p=>p.platform===x).length]).filter(x=>x[1]).map(x=>x[0]+' '+x[1]).join(', ')||'none yet';
  const pil=Object.keys(PILLARS).map(k=>[k,ps.filter(p=>p.pillar===k).length]).filter(x=>x[1]).map(x=>x[0]+' '+Math.round(x[1]/ps.length*100)+'%').join(', ');
  const res=M.filter(([k])=>tot(k)>0).map(([k,l])=>l.toLowerCase()+' '+tot(k).toLocaleString()).join(', ');
  const top=ps.filter(p=>p.reach!=null).sort((a,b)=>b.reach-a.reach)[0];
  const L=[`Hi! Here is your social media recap for ${mTitle()}.`,'',`• Posts: ${ps.length} planned, ${cn('Posted')} published, ${cn('Scheduled')} scheduled`,`• By platform: ${pl}`];
  if(pil)L.push(`• Content mix: ${pil}`);if(res)L.push(`• Results so far: ${res}`);
  if(top)L.push(`• Top post: ${top.platform}, ${top.post_date} (${top.reach.toLocaleString()} reach) — "${(top.caption||'').replace(/\s+/g,' ').slice(0,80)}"`);
  L.push('','Let me know if you have any questions or would like to change anything for next month.');
  const d=dlgOpen(`<h2 style="margin-top:0">Monthly recap · ${esc(mTitle())}</h2><textarea id="rct" rows="12">${esc(L.join('\n'))}</textarea><div class="row" style="margin-top:8px"><button type="button" class="p" id="rcc">Copy</button></div>${muted('Edit the text before you send it. Change the month in the calendar view first.')}`);
  Q('#rcc').onclick=()=>{try{navigator.clipboard.writeText(Q('#rct').value);}catch(e){Q('#rct').select();document.execCommand('copy');}toast('Copied.');};}
async function backupForm(){
  const d=dlgOpen('<h2 style="margin-top:0">Full backup</h2><div id="bkm">Loading every client’s posts…</div>');
  try{const all=await fetchAll('posts','*'),cs=await fetchAll('clients','*'),nm=id=>(cs.find(c=>c.id===id)||{}).name||id,st=iso(new Date());
    Q('#bkm').innerHTML=`<p>${all.length} posts across ${cs.length} clients.</p><div class="row"><button type="button" class="p" id="bj">Download JSON (complete)</button><button type="button" id="bcv">Download CSV (spreadsheet)</button></div>${muted('Comments and settings are not included. Use the Supabase export for those.')}`;

<script>
(function(){

/* ---------- in-app back button (client) ----------
   stack = where the client is: calendar, then list/feed, then a post.
   Back steps down that stack; popups close first; Back on the calendar leaves the site. */
const key=()=>lv===false?'post':lv===true?'list':lv==='feed'?'feed':lv==='ideas'?'ideas':lv==='week'?'week':'cal';
let stack=['cal'],inited=false,pop=false,waiting=null,wt=0,pendSync=false,pendLay=false;
const st=(s,n)=>({cc:n||1,stack:s.slice(),idx:idx});
function expect(fn){waiting=fn;clearTimeout(wt);wt=setTimeout(()=>{if(waiting){const f=waiting;waiting=null;f();settle();}},800);}
function settle(){if(pendLay){pendLay=false;layers();}if(pendSync){pendSync=false;sync();}}
function target(k){
  if(k==='cal')return ['cal'];
  if(k==='list'||k==='feed'||k==='ideas'||k==='week')return ['cal',k];
  const base=stack[stack.length-1]==='post'?stack.slice(0,-1):stack;
  return base.concat('post');}
function pushMany(arr){arr.forEach(v=>{stack.push(v);history.pushState(st(stack),'');});}
function sync(){
  if(!isCli())return;
  if(waiting||pop){pendSync=true;return;}
  const k=key();
  if(!inited){inited=true;stack=['cal'];history.replaceState(st(stack),'');if(k!=='cal')pushMany(target(k).slice(1));return;}
  const tg=target(k);let c=0;
  while(c<stack.length&&c<tg.length&&stack[c]===tg[c])c++;
  const pops=stack.length-c,add=tg.slice(c);
  if(!pops){if(add.length)pushMany(add);else history.replaceState(st(stack),'');return;}
  expect(()=>{stack=stack.slice(0,c);if(add.length)pushMany(add);});
  history.go(-pops);}
const anyLayer=()=>!!(Q('#lbx')||Q('#tour')||(Q('#dlg')&&Q('#dlg').open));
function layers(){
  if(!isCli())return;
  if(waiting){pendLay=true;return;}
  const a=anyLayer();
  if(a&&!pop){pop=true;history.pushState(st(stack,2),'');}
  else if(!a&&pop){pop=false;expect(()=>{});history.back();}}
function closeTop(){
  const l=Q('#lbx');if(l){l.click();return;}

  const s=e.state;

    stack=s.stack.slice();const k=stack[stack.length-1];

window.ccSeen=async function(){

const seenC={};
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<2)return 'just now';if(m<60)return m+' minutes ago';const h=Math.round(m/60);if(h<24)return h+(h===1?' hour':' hours')+' ago';const d=Math.round(h/24);return d+(d===1?' day':' days')+' ago';};
function seenTxt(r){return r==='na'?'':r?`👁 Client last opened the calendar ${ago(r)} (${new Date(r).toLocaleString('en',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}).`:'👁 The client has not opened the calendar yet.';}
function seenRun(){
  if(!isAdm()||!cid||!['month','week','list','board','feed','year'].includes(vw))return;

    const id=cid;if(c&&c.busy)return;seenC[id]=c||{v:'na',t:0};seenC[id].busy=true;
    sb.from('client_seen').select('seen_at').eq('client_id',id).order('seen_at',{ascending:false}).limit(1).then(r=>{
      seenC[id]={v:r.error?'na':(r.data&&r.data[0]?new Date(r.data[0].seen_at).getTime():null),t:Date.now()};

/* ---------- add to home screen tip (phones) ---------- */

  Q('#topb').insertAdjacentHTML('afterend',`<div class="a2" id="a2hs" role="note"><span>📲 ${how}</span>${bip?'<button type="button" class="p" id="a2y">Add</button>':''}<button type="button" id="a2n">Not now</button></div>`);
  const done=()=>{try{localStorage.setItem('a2hs','1');}catch(e){}const x=Q('#a2hs');if(x)x.remove();};
  Q('#a2n').onclick=done;
  if(bip)Q('#a2y').onclick=async()=>{try{bip.prompt();await bip.userChoice;}catch(e){}bip=null;done();};}

/* ---------- admin: replacement files next to the client's comment ---------- */
const _sc=window.showComments;

  const r=await _sc.apply(this,arguments);

  return r;};
async function repl(pid,sel){
  const box=Q(sel);if(!box)return;
  const nodes=[...box.querySelectorAll('.cbody')].filter(n=>/Replacement attached: /.test(n.textContent));
  if(!nodes.length)return;

      anchor.insertAdjacentElement('afterend',w);anchor=w;});});}
