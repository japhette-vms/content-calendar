<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f5fa;--card:#fff;--ink:#1d2030;--mute:#6b6f85;--line:#e1e0ec;--acc:#4b3fd6;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14151f;--card:#1d1f2e;--ink:#eceefa;--mute:#9a9eb8;--line:#2d3047;--acc:#8d83ff;--accink:#14151f}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:1100px;margin:0 auto;padding:20px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:500}
button.ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
button.bad{background:#c2410c;color:#fff;border-color:#c2410c}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
.login{max-width:340px;margin:12vh auto;background:var(--card);padding:28px;border-radius:12px;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.stat b{display:block;font-size:20px}
.warn{background:#fff3d6;color:#6a4a00;border-radius:8px;padding:8px 12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:var(--bg);padding:6px;font-size:12px;color:var(--mute);text-align:center}
.day{background:var(--card);min-height:96px;padding:4px;font-size:12px}
.day.off{opacity:.45}
.day>span{color:var(--mute)}
.chip{display:block;width:100%;text-align:left;margin-top:3px;padding:2px 5px;border:0;border-radius:5px;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.badge{display:inline-block;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:500}
.b-Pending{background:#fff3d6;color:#6a4a00}.b-Approved{background:#d8f3e6;color:#145a3b}.b-Changes{background:#ffe0d2;color:#8a2f08}
.cap{white-space:pre-wrap;font-size:16px;margin:14px 0}
.cm{border-top:1px solid var(--line);padding:6px 0;font-size:14px}.cm small{color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:20px}
dialog::backdrop{background:#0008}
dialog{max-height:90vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:#c2410c;font-size:14px;min-height:20px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.wd h3{margin:0 0 6px;font-size:15px}.wd.today{border-color:var(--acc)}
.wp{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0}
.wp i{width:6px;align-self:stretch;border-radius:3px;flex:none}
.wp .meta{color:var(--mute);font-size:13px}
.pt{display:none}
@media print{header,.noprint,.legend,dialog{display:none!important}.pt{display:block}
body{background:#fff;color:#000;font-size:12px}main{padding:0;max-width:none}
.wd{border:1px solid #bbb;background:#fff;break-inside:avoid}.wp{break-inside:avoid;color:#000}.wp .meta,.cap{color:#444}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:640px){.day{min-height:60px}.chip{font-size:10px}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
const SB_URL='https://ognxncsuxhaewpvxrcwi.supabase.co';
const SB_KEY='sb_publishable_hxHsGW9la9lXCsK9pnwe6A_ANQjFJ3u';
const sb=supabase.createClient(SB_URL,SB_KEY);
let PILLARS={'Educational':'#7c5cd6','Promo':'#e0634f','Behind the Scenes':'#1f9a8a','Testimonials':'#d6478f','Community':'#3b7fd6','Trending':'#c98a0b','Spotlight':'#3a9a4f'};
const PLATFORMS=['Google Business Profile','Facebook','Instagram','TikTok','LinkedIn'];
let GOALS={'Google Business Profile':1,'Facebook':3,'Instagram':4,'TikTok':2,'LinkedIn':2};
const DEF_P={...PILLARS},DEF_G={...GOALS};let MIX=40,GAP=75;
const FORMATS=['Reel','Carousel','Story','Static Photo','Video','Text Only','Live'];
const STATUS=['Draft','Approved','Scheduled','Posted'];
const MARK={Draft:'○',Approved:'□',Scheduled:'■',Posted:'●'};
const APPR=['Pending','Approved','Changes requested'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let me=null,user=null,clients=[],cid=null,posts=[],keyDates=[],month=new Date(new Date().getFullYear(),new Date().getMonth(),1),idx=0,lv=false,flt='All';
month.setDate(1);

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  user=session.user;
  const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error||!data){await sb.auth.signOut();return loginView('This login is not linked to a calendar yet. Ask your social media manager.');}
  me=data;
  if(me.role==='admin'){
    const r=await sb.from('clients').select('*').order('name');
    clients=r.data||[];cid=clients[0]?.id||null;
  } else cid=me.client_id;
  await loadPosts();
  me.role==='admin'?adminView():clientView();
}
function loginView(msg=''){
  $('#app').innerHTML=`<form class="login" id="lf"><h1 style="margin-top:0">Content Calendar</h1>
  <label for="em">Email</label><input id="em" type="email" required autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
  <p class="err" id="le">${esc(msg)}</p><button class="p" style="width:100%">Log in</button></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error) $('#le').textContent='Email or password is incorrect.'; else boot();};
}
async function loadPosts(){
  if(!cid){posts=[];return;}
  const {data,error}=await sb.from('posts').select('*').eq('client_id',cid).order('post_date').order('post_time');
  if(error) alert('Could not load posts: '+error.message);
  posts=data||[];
  const kd=await sb.from('key_dates').select('*').eq('client_id',cid).order('key_date');
  keyDates=kd.data||[];
  const st=await sb.from('client_settings').select('*').eq('client_id',cid).maybeSingle();
  const s=st.data||{};
  const rawP=s.pillars&&Object.keys(s.pillars).length?s.pillars:{...DEF_P};
  const ord=Object.keys(DEF_P);
  PILLARS={};Object.keys(rawP).sort((x,y)=>{const i=ord.indexOf(x),j=ord.indexOf(y);return (i<0?99:i)-(j<0?99:j)||x.localeCompare(y);}).forEach(k=>PILLARS[k]=rawP[k]);
  GOALS=s.goals&&Object.keys(s.goals).length?s.goals:{...DEF_G};
  MIX=s.mix_threshold||40;GAP=s.repost_gap||75;
  if(me&&me.role==='admin'){const hs=await sb.from('hashtag_sets').select('*').eq('client_id',cid).order('name');hsets=hs.data||[];}else hsets=[];
}
const head=(extra='')=>`<header><h1>Content Calendar</h1>${extra}${me&&me.role==='admin'?'<button id="tl">Tools</button>':'<button id="hp">Help</button>'}<button id="out">Log out</button></header>`;
function bindOut(){
  $('#out').onclick=async()=>{await sb.auth.signOut();me=null;loginView();};
  if($('#tl')) $('#tl').onclick=toolsForm;
  if($('#hp')) $('#hp').onclick=()=>helpForm();
}

/* ---------- Admin ---------- */
let vw='month',wkStart=null,hsets=[],yr=new Date().getFullYear();
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return iso(d);};
const M=[['reach','Reach'],['likes','Likes'],['comments_count','Comments'],['shares_saves','Shares / saves'],['dms_inquiries','DMs / inquiries'],['link_clicks','Link clicks'],['engagements','Engagements']];
const inMonth=(p,y,m)=>{if(!p.post_date)return false;const d=new Date(p.post_date+'T00:00');return d.getMonth()===m&&d.getFullYear()===y;};
function adminView(){
  if(vw==='week') return weekView();
  if(vw==='report') return reportView();
  if(vw==='year') return yearView();
  const y=month.getFullYear(),m=month.getMonth();
  const mp=posts.filter(p=>p.post_date&&new Date(p.post_date+'T00:00').getMonth()===m&&new Date(p.post_date+'T00:00').getFullYear()===y);
  const cnt=s=>mp.filter(p=>p.status===s).length;
  const need=mp.filter(p=>flag(p)).length;
  const tot=k=>mp.reduce((a,p)=>a+(+p[k]||0),0);
  const todayS=iso(new Date());
  const ready=posts.filter(p=>p.repost&&p.status==='Posted'&&p.post_date&&addDays(p.post_date,GAP)<=todayS&&!posts.some(q=>q.id!==p.id&&q.caption===p.caption&&q.post_date>p.post_date)).slice(0,6);
  const rdy=ready.length?`<h3>Ready to repost</h3><div class="pace">${ready.map(p=>`<button class="stat rr" data-id="${p.id}" style="text-align:left"><b style="font-size:14px">${esc(p.platform)} · ${esc(p.post_date)}</b>${esc((p.caption||'').slice(0,60))}</button>`).join('')}</div>`:'';
  const tiles=mp.some(p=>M.some(([k])=>p[k]!=null))?M.filter(([k])=>tot(k)>0).map(([k,l])=>`<div class="stat"><b>${tot(k).toLocaleString()}</b>${l}</div>`).join(''):'';
  // mix warning
  const byP={};mp.forEach(p=>byP[p.pillar]=(byP[p.pillar]||0)+1);
  const over=Object.entries(byP).filter(([k,v])=>mp.length&&v/mp.length*100>MIX&&k!=='undefined'&&k!=='null');
  // weekly pace (current week, Mon–Sun)
  const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const wk=posts.filter(p=>p.post_date>=iso(mon)&&p.post_date<=iso(sun));
  const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(i>=35&&d.getMonth()!==m)break;
    const ds=iso(d);
    const chips=posts.filter(p=>p.post_date===ds).map(p=>`<button class="chip" style="background:${PILLARS[p.pillar]||'#6b6f85'}" data-id="${p.id}">${MARK[p.status]||'○'} ${esc((p.platform||'').split(' ')[0])}${p.approval==='Approved'?' ✓':''}${flag(p)?' (!)':''}</button>`).join('');
    cells+=`<div class="day${d.getMonth()!==m?' off':''}"><span>${d.getDate()}</span>${keyDates.filter(k=>k.key_date===ds).map(k=>`<div style="color:var(--acc);font-size:11px">★ ${esc(k.label)}</div>`).join('')}${chips}</div>`;
  }
  $('#app').innerHTML=head(`<select id="cs" style="width:auto" aria-label="Client">${clients.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button id="vwb">Week view</button><button id="rpb">Report</button><button id="yrb">Year</button><button id="st">Settings</button><button class="p" id="np">New post</button>`)+
  `<main><div class="row"><button id="pm" aria-label="Previous month">‹</button><h2 style="margin:0;flex:1;text-align:center">${month.toLocaleString('en',{month:'long',year:'numeric'})}</h2><button id="nm" aria-label="Next month">›</button></div>
  <div class="stats"><div class="stat"><b>${mp.length}</b>Posts this month</div>${STATUS.map(s=>`<div class="stat"><b>${cnt(s)}</b>${MARK[s]} ${s==='Approved'?'Status: Approved':s}</div>`).join('')}<div class="stat"><b>${mp.filter(p=>p.approval==='Approved').length}</b>✓ Client approved</div><div class="stat"><b>${mp.filter(p=>p.approval==='Pending').length}</b>Awaiting approval</div><div class="stat"><b>${need}</b>(!) Need attention</div></div>
  ${tiles?`<div class="stats">${tiles}</div>`:''}
  ${over.map(([k,v])=>`<div class="warn">${esc(k)} is ${Math.round(v/mp.length*100)}% of this month's posts. Consider mixing in other pillars.</div>`).join('')}
  ${clients.length?'':'<div class="warn">No clients yet. Add one in Supabase (see the handover SQL), then refresh.</div>'}
  <div class="grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  <div class="legend">${Object.entries(PILLARS).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}<span>✓ client approved</span><span>(!) changes requested or no caption</span></div>
  <h3>This week against goals</h3><div class="pace">${PLATFORMS.map(pl=>{const n=wk.filter(p=>p.platform===pl).length;return `<div class="stat"><b>${n} / ${GOALS[pl]??0}</b>${pl}</div>`}).join('')}</div>${rdy}</main>`;
  bindOut();
  $('#cs').onchange=async e=>{cid=e.target.value;await loadPosts();adminView();};
  $('#pm').onclick=()=>{month.setMonth(month.getMonth()-1);adminView();};
  $('#nm').onclick=()=>{month.setMonth(month.getMonth()+1);adminView();};
  $('#np').onclick=()=>postForm();
  $('#st').onclick=()=>settingsForm();
  $('#rpb').onclick=()=>{vw='report';adminView();};
  $('#yrb').onclick=()=>{vw='year';yr=month.getFullYear();adminView();};
  $('#vwb').onclick=()=>{vw='week';const n=new Date();wkStart=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7));adminView();};
  document.querySelectorAll('.rr').forEach(b=>b.onclick=()=>postForm(posts.find(p=>p.id===b.dataset.id)));
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>postForm(posts.find(p=>p.id===b.dataset.id)));
}

function weekView(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date(wkStart);d.setDate(wkStart.getDate()+i);return d;});
  const fmt=d=>d.toLocaleDateString('en',{day:'numeric',month:'short'});
  const range=fmt(days[0])+' – '+fmt(days[6])+' '+days[6].getFullYear();
  const cname=(clients.find(c=>c.id===cid)||{}).name||'';
  const todayS=iso(new Date());
  const body=days.map(d=>{
    const ds=iso(d);
    const ps=posts.filter(p=>p.post_date===ds).sort((a,b)=>(a.post_time||'99').localeCompare(b.post_time||'99'));
    const kds=keyDates.filter(k=>k.key_date===ds).map(k=>`<div style="color:var(--acc);font-size:13px">★ ${esc(k.label)}</div>`).join('');
    return `<div class="wd${ds===todayS?' today':''}"><h3>${d.toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})}</h3>${kds}
    ${ps.map(p=>`<button class="wp" data-id="${p.id}"><i style="background:${PILLARS[p.pillar]||'#6b6f85'}"></i><div style="flex:1"><div><b>${MARK[p.status]||'○'} ${esc(p.platform)}</b> <span class="meta">${p.post_time?esc(p.post_time.slice(0,5))+' · ':''}${esc(p.format)} · ${esc(p.pillar)} · ${esc(p.status)}${p.approval==='Approved'?' · ✓ client approved':p.approval==='Changes requested'?' · changes requested':' · awaiting approval'}</span></div>
    <div style="margin-top:3px">${p.caption?esc(p.caption).slice(0,300):'<span class="meta">(!) No caption yet</span>'}</div>${p.hashtags?`<div class="meta">${esc(p.hashtags)}</div>`:''}</div></button>`).join('')||'<div style="color:var(--mute);font-size:13px">Nothing planned.</div>'}</div>`;
  }).join('');
  const wk=posts.filter(p=>p.post_date>=iso(days[0])&&p.post_date<=iso(days[6]));
  $('#app').innerHTML=head(`<select id="cs" style="width:auto" aria-label="Client">${clients.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button id="vwb">Month view</button><button id="rpb">Report</button><button id="yrb">Year</button><button id="pr">Print</button><button class="p" id="np">New post</button>`)+
  `<main><div class="pt"><h2 style="margin:0">${esc(cname)} – content plan</h2></div>
  <div class="row noprint"><button id="pw" aria-label="Previous week">‹</button><h2 style="margin:0;flex:1;text-align:center">${range}</h2><button id="nw" aria-label="Next week">›</button></div>
  <h2 class="pt" style="text-align:center">${range}</h2>
  <div class="pace" style="margin:12px 0">${PLATFORMS.map(pl=>`<div class="stat"><b>${wk.filter(p=>p.platform===pl).length} / ${GOALS[pl]??0}</b>${pl}</div>`).join('')}</div>
  ${body}</main>`;
  bindOut();
  $('#cs').onchange=async e=>{cid=e.target.value;await loadPosts();adminView();};
  $('#vwb').onclick=()=>{vw='month';adminView();};
  $('#pr').onclick=()=>window.print();
  $('#rpb').onclick=()=>{vw='report';adminView();};
  $('#yrb').onclick=()=>{vw='year';yr=month.getFullYear();adminView();};
  $('#np').onclick=()=>postForm();
  $('#pw').onclick=()=>{wkStart.setDate(wkStart.getDate()-7);adminView();};
  $('#nw').onclick=()=>{wkStart.setDate(wkStart.getDate()+7);adminView();};
  document.querySelectorAll('.wp').forEach(b=>b.onclick=()=>postForm(posts.find(p=>p.id===b.dataset.id)));
}

function reportView(){
  const y=month.getFullYear(),m=month.getMonth();
  const mp=posts.filter(p=>inMonth(p,y,m)).sort((a,b)=>a.post_date.localeCompare(b.post_date));
  const cname=(clients.find(c=>c.id===cid)||{}).name||'';
  const title=month.toLocaleString('en',{month:'long',year:'numeric'});
  const tot=k=>mp.reduce((a,p)=>a+(+p[k]||0),0);
  const cntBy=(f,vals)=>vals.map(v=>[v,mp.filter(p=>p[f]===v).length]);
  const score=p=>(+p.engagements||0)||((+p.likes||0)+(+p.comments_count||0)+(+p.shares_saves||0));
  const top=mp.filter(p=>score(p)>0).sort((a,b)=>score(b)-score(a)).slice(0,3);
  const hasRes=M.some(([k])=>tot(k)>0);
  const box=(n,l)=>`<div class="stat"><b>${n}</b>${l}</div>`;
  const bar=(label,n,color)=>`<div class="row" style="gap:8px;margin:3px 0;flex-wrap:nowrap"><span style="width:170px;flex:none">${esc(label)}</span><div style="flex:1;background:var(--line);border-radius:4px;height:12px"><div style="width:${mp.length?Math.round(n/mp.length*100):0}%;background:${color};height:12px;border-radius:4px"></div></div><b style="width:24px;text-align:right">${n}</b></div>`;
  $('#app').innerHTML=head(`<select id="cs" style="width:auto" aria-label="Client">${clients.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button id="vwb">Month view</button><button id="pr">Print / save as PDF</button>`)+
  `<main><div class="row noprint"><button id="pm" aria-label="Previous month">‹</button><h2 style="margin:0;flex:1;text-align:center">${title}</h2><button id="nm" aria-label="Next month">›</button></div>
  <h1 style="margin:14px 0 2px;font-size:24px">${esc(cname)}: ${title} report</h1>
  <p style="color:var(--mute);margin:0 0 10px">Social media content summary</p>
  <h3>Posting summary</h3>
  <div class="stats">${box(mp.length,'Posts planned')}${box(mp.filter(p=>p.status==='Posted').length,'Posted')}${box(mp.filter(p=>p.status==='Scheduled').length,'Scheduled')}${box(mp.filter(p=>p.approval==='Approved').length,'Approved by you')}${box(mp.filter(p=>p.approval==='Changes requested').length,'Changes requested')}${box(mp.filter(p=>p.approval==='Pending').length,'Awaiting approval')}</div>
  <h3>Posts by platform</h3>${cntBy('platform',PLATFORMS).map(([k,n])=>bar(k,n,'#8d83ff')).join('')}
  <h3>Posts by content pillar</h3>${cntBy('pillar',Object.keys(PILLARS)).map(([k,n])=>bar(k,n,PILLARS[k])).join('')}

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('Could not load the Excel reader. Check your internet connection.'));document.head.appendChild(sc);});}
const XMAP={'date':'post_date','time (client)':'post_time','platform':'platform','content pillar':'pillar','format':'format','campaign / promo':'campaign','post copy / caption':'caption','visual / photo (link or status)':'visual','hashtags / tags (pick a set or type)':'hashtags','status':'status','client approval':'approval','assets ready?':'assets_ready','live link':'live_link','notes':'notes','reach':'reach','likes':'likes','comments':'comments_count','shares / saves':'shares_saves','dms / inquiries':'dms_inquiries','link clicks':'link_clicks','engagements':'engagements','asset due date':'asset_due_date','location(s)':'locations','content type':'content_type','approved by':'approved_by','approved on':'approved_on','repost?':'repost','cta (call to action)':'cta','tracking link (utm)':'tracking_url'};
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const name=wb.SheetNames.includes('Posts')?'Posts':wb.SheetNames.find(n=>/post/i.test(n));
  if(!name) throw new Error('No "Posts" sheet found in this file.');
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
  const hi=rows.findIndex(r=>{const t=r.map(x=>String(x??'').trim().toLowerCase());return t.includes('date')&&t.includes('platform');});
  if(hi<0) throw new Error('Could not find the header row (Date, Platform...) in the Posts sheet.');
  const RULES=[[/^time\b/,'post_time'],[/^hashtags/,'hashtags'],[/^visual/,'visual'],[/^post copy|^caption/,'caption'],[/^campaign/,'campaign'],[/^location/,'locations'],[/^cta/,'cta'],[/^tracking/,'tracking_url'],[/^content pillar|^pillar/,'pillar'],[/^client approval|^approval/,'approval']];
  const mapH=x=>{const t=String(x??'').trim().toLowerCase();if(XMAP[t])return XMAP[t];const r=RULES.find(q=>q[0].test(t));return r?r[1]:null;};
  const hdr=rows[hi].map(mapH);
  const txt=v=>{if(v==null||v==='')return null;const t=String(v).trim();return (!t||/^none$/i.test(t))?null:t;};
  const num=v=>{if(v==null||v==='')return null;const n=Number(v);return isFinite(n)?Math.round(n):null;};
  const toDate=v=>{if(v==null||v==='')return null;if(typeof v==='number'){return new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000).toISOString().slice(0,10);}const t=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);const x=new Date(t);return isNaN(x)?null:iso(x);};
  const toTime=v=>{if(typeof v==='number'){const m=Math.round((v%1)*1440);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}if(typeof v==='string'){const m=v.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);if(m){let h=+m[1];if(m[3]){const pm=/pm/i.test(m[3]);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0;}return String(h).padStart(2,'0')+':'+m[2];}}return null;};
  const pick=(v,list,def)=>{const t=txt(v);if(!t)return def;return list.find(x=>x.toLowerCase()===t.toLowerCase())||def;};
  const out=[];let skipped=0;
  rows.slice(hi+1).forEach(r=>{
    const o={};hdr.forEach((k,i)=>{if(k)o[k]=r[i];});
    const date=toDate(o.post_date);
    if(!date||!txt(o.platform)){ if(r.some(v=>v!=null&&v!=='')&&Object.values(o).some(v=>v!=null&&v!=='')) skipped++; return; }
    const post={client_id:cid,post_date:date,post_time:toTime(o.post_time),platform:pick(o.platform,PLATFORMS,txt(o.platform)),pillar:txt(o.pillar),format:txt(o.format),campaign:txt(o.campaign),caption:txt(o.caption),visual:txt(o.visual),hashtags:txt(o.hashtags),status:pick(o.status,STATUS,'Draft'),approval:pick(o.approval,APPR,'Pending'),assets_ready:txt(o.assets_ready),live_link:txt(o.live_link),notes:txt(o.notes),asset_due_date:toDate(o.asset_due_date),locations:txt(o.locations),content_type:txt(o.content_type),repost:/^y/i.test(txt(o.repost)||''),cta:txt(o.cta),tracking_url:txt(o.tracking_url),reach:num(o.reach),likes:num(o.likes),comments_count:num(o.comments_count),shares_saves:num(o.shares_saves),dms_inquiries:num(o.dms_inquiries),link_clicks:num(o.link_clicks),engagements:num(o.engagements)};
    post.engagements=(post.likes!=null||post.comments_count!=null||post.shares_saves!=null)?(post.likes||0)+(post.comments_count||0)+(post.shares_saves||0):null;
    if(post.approval==='Approved'){post.approved_by=txt(o.approved_by);post.approved_on=toDate(o.approved_on);}
    out.push(post);
  });
  return {posts:out,skipped};
}
function importForm(){
  const d=$('#dlg');const cname=(clients.find(c=>c.id===cid)||{}).name||'';
  if(!cid){alert('Add a client first.');return;}
  d.innerHTML=`<h2 style="margin-top:0">Import posts from Excel</h2>
  <p>Posts will be added to <b>${esc(cname)}</b>. Use the Posts sheet of the content calendar workbook. Posts already in the app are kept, so importing the same file twice makes duplicates.</p>
  <input type="file" id="xf" accept=".xlsx,.xlsm"><div id="xo" style="margin:12px 0"></div>
  <div class="row"><button type="button" class="p" id="xgo" style="display:none">Import</button><button type="button" id="cx">Close</button></div>`;
  d.showModal();
  $('#cx').onclick=()=>d.close();
  let found=null;
  $('#xf').onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;
    $('#xo').textContent='Reading the file...';$('#xgo').style.display='none';
    try{
      await loadXLSX();
      found=parseWorkbook(await f.arrayBuffer());
      if(!found.posts.length){$('#xo').innerHTML='<span class="err">No posts with a date and platform were found in that file.</span>';return;}
      const ds=found.posts.map(p=>p.post_date).sort();
      const unk=[...new Set(found.posts.map(p=>p.pillar).filter(x=>x&&!PILLARS[x]))];
      $('#xo').innerHTML=`Found <b>${found.posts.length}</b> posts, from ${ds[0]} to ${ds[ds.length-1]}.${found.skipped?` ${found.skipped} row(s) skipped (no date or platform).`:''}${unk.length?`<div class="warn">Pillars not in this client's settings: ${esc(unk.join(', '))}. They import fine, but add them in Settings to give them a colour.</div>`:''}`;
      $('#xgo').textContent='Import '+found.posts.length+' posts';$('#xgo').style.display='';
    }catch(err){$('#xo').innerHTML='<span class="err">'+esc(err.message)+'</span>';}
  };
  $('#xgo').onclick=async()=>{
    if(!found)return;$('#xgo').disabled=true;$('#xo').textContent='Importing...';
    for(let i=0;i<found.posts.length;i+=100){
      const r=await sb.from('posts').insert(found.posts.slice(i,i+100));
      if(r.error){$('#xo').innerHTML='<span class="err">Stopped: '+esc(r.error.message)+'. Posts before this batch may already have been added; check the calendar before trying again.</span>';$('#xgo').disabled=false;return;}
    }
    d.close();await loadPosts();vw='month';adminView();alert('Imported '+found.posts.length+' posts.');
  };
}

  <div class="pace" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${cards}</div>
  <div class="legend">${Object.entries(PILLARS).map(([k,c])=>`<span><i style="background:${c}"></i>${esc(k)}</span>`).join('')}</div>
  ${kds.length?`<h3>Key dates</h3>${kds.map(k=>`<div class="cm">★ ${esc(k.key_date)}: ${esc(k.label)}</div>`).join('')}`:''}
  <p class="noprint" style="color:var(--mute);font-size:13px">Click a month to open it. The coloured bar shows the mix of content pillars.</p></main>`;
  bindOut();
  $('#cs').onchange=async e=>{cid=e.target.value;await loadPosts();adminView();};
  $('#vwb').onclick=()=>{vw='month';adminView();};
  $('#pr').onclick=()=>window.print();
  $('#py').onclick=()=>{yr--;adminView();};
  $('#ny').onclick=()=>{yr++;adminView();};
  document.querySelectorAll('.ym').forEach(b=>b.onclick=()=>{month=new Date(yr,+b.dataset.m,1);vw='month';adminView();});
}
const flag=p=>p.approval==='Changes requested'||(!p.caption&&p.status!=='Posted');
const opts=(arr,v)=>arr.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('');

async function postForm(p={}){
  if(!cid) return alert('Add a client first.');
  const d=$('#dlg');
  d.innerHTML=`<form id="pf"><h2 style="margin-top:0">${p.id?'Edit post':'New post'}</h2>
  <div class="g2"><div><label>Date</label><input name="post_date" type="date" required value="${p.post_date||''}"></div>
  <div><label>Time (client's local time)</label><input name="post_time" type="time" value="${(p.post_time||'').slice(0,5)}"></div>
  <div><label>Platform</label><select name="platform">${opts(PLATFORMS,p.platform)}</select></div>
  <div><label>Content pillar</label><select name="pillar"><option value=""${p.id&&!p.pillar?' selected':''}>(none)</option>${opts(Object.keys(PILLARS),p.pillar||(p.id?null:Object.keys(PILLARS)[0]))}</select></div>
  <div><label>Format</label><select name="format">${opts(FORMATS,p.format)}</select></div>
  <div><label>Status</label><select name="status">${opts(STATUS,p.status||'Draft')}</select></div>
  <div><label>Client approval</label><select name="approval">${opts(APPR,p.approval||'Pending')}</select></div>
  <div><label>Campaign / promo</label><input name="campaign" value="${esc(p.campaign)}"></div></div>
  <label>Post copy / caption</label><textarea name="caption" rows="4">${esc(p.caption)}</textarea>
  <label>Visual / photo</label><input name="visual" value="${esc(p.visual)}">
  <label>Hashtags</label><input name="hashtags" value="${esc(p.hashtags)}">${hsets.length?`<select id="hs" style="margin-top:6px"><option value="">Add a saved hashtag set...</option>${hsets.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select>`:''}
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="repost" style="width:auto" ${p.repost?'checked':''}> Evergreen: can be reposted</label><div id="rpd" style="font-size:13px;color:var(--mute)"></div>
  <h3 style="margin:16px 0 0;font-size:15px">Results (fill in after the post is live)</h3>
  <div class="g2">${M.map(([k,l])=>`<div><label>${l}</label><input type="number" min="0" name="${k}" value="${p[k]??''}"></div>`).join('')}</div>
  <label>Notes</label><textarea name="notes" rows="2">${esc(p.notes)}</textarea>
  <div id="cmx"></div>
  <p class="err" id="pe"></p>
  <div class="row"><button class="p">Save post</button><button type="button" id="cx">Cancel</button>${p.id?'<button type="button" id="rp">Repost this</button>':''}${p.id?'<button type="button" class="bad" id="del" style="margin-left:auto">Delete</button>':''}</div></form>`;
  d.showModal();
  $('#cx').onclick=()=>d.close();
  const updRp=()=>{const f=$('#pf');const dt=f.post_date.value;$('#rpd').textContent=f.repost.checked&&dt?'Can be reposted from '+addDays(dt,GAP)+' ('+GAP+' days after this date).':'';};
  $('#pf').repost.onchange=updRp;$('#pf').post_date.onchange=updRp;updRp();
  if($('#hs')) $('#hs').onchange=e=>{const h=hsets.find(x=>x.id===e.target.value);if(h){const i=$('#pf').hashtags;i.value=(i.value.trim()?i.value.trim()+' ':'')+h.tags;}e.target.value='';};
  if(p.id) $('#rp').onclick=()=>{d.close();postForm({...p,id:undefined,post_date:p.post_date?addDays(p.post_date,GAP):'',status:'Draft',approval:'Pending',approved_by:null,approved_on:null,repost:false,live_link:null,reach:null,likes:null,comments_count:null,shares_saves:null,dms_inquiries:null,link_clicks:null,engagements:null});};
  if(p.id) showComments(p.id,'#cmx');
  $('#pf').onsubmit=async e=>{e.preventDefault();
    const f=Object.fromEntries(new FormData(e.target));
    f.post_time=f.post_time||null;f.client_id=cid;
    M.forEach(([k])=>{f[k]=(f[k]===''||f[k]==null)?null:+f[k];});
    f.repost=f.repost==='on';
    if(f.approval!==p.approval&&f.approval==='Pending'){f.approved_by=null;f.approved_on=null;}
    const r=p.id?await sb.from('posts').update(f).eq('id',p.id):await sb.from('posts').insert(f);
    if(r.error) return $('#pe').textContent='Could not save: '+r.error.message;
    d.close();await loadPosts();adminView();};
  if(p.id) $('#del').onclick=async()=>{if(!confirm('Delete this post?'))return;await sb.from('posts').delete().eq('id',p.id);d.close();await loadPosts();adminView();};
}
function settingsForm(){
  if(!cid) return alert('Add a client first.');
  const d=$('#dlg'),pl=[...Object.entries(PILLARS),['','#6b6f85']];
  d.innerHTML=`<form id="sf"><h2 style="margin-top:0">Settings for ${esc(clients.find(c=>c.id===cid)?.name)}</h2>
  <h3>Weekly post goals</h3><div class="g2">${PLATFORMS.map(p=>`<div><label>${p}</label><input type="number" min="0" name="g:${p}" value="${GOALS[p]??0}"></div>`).join('')}</div>
  <h3>Content pillars</h3>${pl.map(([n,c],i)=>`<div class="row" style="margin-top:6px"><input name="pn${i}" value="${esc(n)}" placeholder="New pillar" style="flex:1"><input type="color" name="pc${i}" value="${c}" style="width:56px;padding:2px"></div>`).join('')}
  <p style="font-size:12px;color:var(--mute)">Renaming a pillar does not change posts already saved under the old name.</p>
  <div class="g2"><div><label>Warn when one pillar is over (%)</label><input type="number" name="mix" value="${MIX}"></div><div><label>Repost gap (days)</label><input type="number" name="gap" value="${GAP}"></div></div>
  <p class="err" id="se"></p><div class="row"><button class="p">Save settings</button><button type="button" id="sx">Close</button></div></form>
  <h3>Key dates</h3><div id="kdl"></div>
  <div class="row" style="margin-top:8px"><input type="date" id="kdd" style="width:auto"><input id="kdt" placeholder="e.g. Thanksgiving" style="flex:1"><button type="button" id="kda">Add</button></div>`;
  const kl=()=>{$('#kdl').innerHTML=keyDates.map(k=>`<div class="cm row">${k.key_date} · ${esc(k.label)}<button type="button" data-k="${k.id}" style="margin-left:auto">Remove</button></div>`).join('')||'<div class="cm"><small>No key dates yet.</small></div>';
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{await sb.from('key_dates').delete().eq('id',b.dataset.k);await loadPosts();kl();});};
  kl();
  $('#kda').onclick=async()=>{const dt=$('#kdd').value,lb=$('#kdt').value.trim();if(!dt||!lb)return;
    const r=await sb.from('key_dates').insert({client_id:cid,key_date:dt,label:lb});
    if(r.error)return alert('Could not add: '+r.error.message);
    $('#kdt').value='';await loadPosts();kl();};
  $('#sx').onclick=()=>{d.close();adminView();};
  $('#sf').onsubmit=async e=>{e.preventDefault();
    const f=Object.fromEntries(new FormData(e.target)),goals={},pillars={};
    PLATFORMS.forEach(p=>goals[p]=+f['g:'+p]||0);
    pl.forEach((_,i)=>{const n=(f['pn'+i]||'').trim();if(n)pillars[n]=f['pc'+i];});
    if(!Object.keys(pillars).length) return $('#se').textContent='Keep at least one pillar.';
    const r=await sb.from('client_settings').upsert({client_id:cid,goals,pillars,mix_threshold:+f.mix||40,repost_gap:+f.gap||75});
    if(r.error) return $('#se').textContent='Could not save: '+r.error.message;
    d.close();await loadPosts();adminView();};
  d.showModal();
}
async function showComments(pid,sel){
  const {data}=await sb.from('comments').select('*').eq('post_id',pid).order('created_at');
  $(sel).innerHTML=`<h3 style="margin-bottom:4px">Comments</h3>${(data||[]).map(c=>`<div class="cm">${esc(c.body)}<br><small>${new Date(c.created_at).toLocaleString()}${c.author_id===user.id?' · you':''}</small></div>`).join('')||'<div class="cm"><small>No comments yet.</small></div>'}
  <div class="row" style="margin-top:8px"><input id="cin" placeholder="Write a comment" style="flex:1"><button type="button" id="cad">Add comment</button></div>`;
  $('#cad').onclick=async()=>{const b=$('#cin').value.trim();if(!b)return;
    const r=await sb.from('comments').insert({post_id:pid,author_id:user.id,body:b});
    if(r.error) return alert('Could not add comment: '+r.error.message);
    showComments(pid,sel);};
}

/* ---------- Client ---------- */
function listView(m){
  const kk=p=>p.approval==='Changes requested'?'Changes':p.approval;
  const lab={Pending:'Waiting for your approval',Approved:'Approved',Changes:'Changes requested'};
  const shown=posts.filter(p=>flt==='All'||p.approval===flt);
  m.innerHTML=`<div class="row" style="margin-bottom:10px"><button id="one">One at a time</button><select id="ft" style="width:auto" aria-label="Filter posts">${['All','Pending','Approved','Changes requested'].map(f=>`<option value="${f}"${f===flt?' selected':''}>${f==='All'?'All posts':f==='Pending'?'Waiting for approval':f}</option>`).join('')}</select><span style="color:var(--mute)">${shown.length} of ${posts.length} posts</span></div>
  ${shown.map(p=>`<button class="card" data-i="${posts.indexOf(p)}" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:14px"><div class="row"><b>${p.post_date?new Date(p.post_date+'T00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'}):'No date'}</b><span style="color:var(--mute)">${esc(p.platform)}</span><span class="badge" style="background:${PILLARS[p.pillar]||'#6b6f85'};color:#fff;font-size:12px">${esc(p.pillar)}</span><span class="badge b-${kk(p)}" style="margin-left:auto;font-size:12px">${lab[kk(p)]}</span></div><div style="margin-top:6px;color:var(--mute)">${esc((p.caption||'No caption yet.').slice(0,140))}</div></button>`).join('')||'<div class="card">No posts match this filter.</div>'}`;
  $('#one').onclick=()=>{lv=false;clientView();};
  $('#ft').onchange=e=>{flt=e.target.value;clientView();};
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{lv=false;idx=+b.dataset.i;clientView();});
}
function clientView(){
  $('#app').innerHTML=head(`<span style="color:var(--mute)">${posts.filter(p=>p.approval==='Pending').length} waiting for your approval</span>`)+`<main id="cm"></main>`;
  bindOut();
  const m=$('#cm');
  if(!posts.length){m.innerHTML='<div class="card">No posts have been added to your calendar yet. Check back soon.</div>';return;}
  if(lv) return listView(m);
  idx=Math.min(idx,posts.length-1);
  const p=posts[idx],k=p.approval==='Changes requested'?'Changes':p.approval;
  const when=p.post_date?new Date(p.post_date+'T00:00').toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'}):'No date';
  m.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button id="pv"${idx===0?' disabled':''}>‹ Previous</button><button id="lv">View all posts</button><span>Post ${idx+1} of ${posts.length}</span><button id="nx"${idx===posts.length-1?' disabled':''}>Next ›</button></div>
  <div class="card"><div class="row"><span class="badge b-${k}">${k==='Pending'?'Waiting for your approval':k==='Approved'?'Approved':'Changes requested'}</span>
  <span style="color:var(--mute)">${esc(p.platform)} · ${esc(when)}${p.post_time?' at '+esc(p.post_time.slice(0,5)):''}</span></div>
  <div class="cap">${esc(p.caption)||'<i>No caption yet.</i>'}</div>
  ${p.visual?`<p><b>Visual:</b> ${esc(p.visual)}</p>`:''}
  <p style="color:var(--mute)"><span class="badge" style="background:${PILLARS[p.pillar]||'#6b6f85'};color:#fff">${esc(p.pillar)}</span> ${esc(p.format)} ${p.hashtags?'· '+esc(p.hashtags):''}</p>
  <div class="row"><button class="ok" id="ap">Approve</button><button class="bad" id="rc">Request changes</button></div>
  <div id="cmx" style="margin-top:14px"></div></div>`;
  $('#lv').onclick=()=>{lv=true;clientView();};
  $('#pv').onclick=()=>{idx--;clientView();};$('#nx').onclick=()=>{idx++;clientView();};
  const act=async v=>{const r=await sb.rpc('set_approval',{p_post:p.id,p_approval:v});
    if(r.error) return alert('Could not save: '+r.error.message);
    await loadPosts();clientView();};
  $('#ap').onclick=()=>act('Approved');$('#rc').onclick=()=>act('Changes requested');
  showComments(p.id,'#cmx');
}
boot();
</script>
</body>
</html>
