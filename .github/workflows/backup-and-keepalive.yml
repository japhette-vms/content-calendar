name: Weekly backup and keep-alive
on:
  schedule: [{ cron: '0 2 * * 1' }]
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export tables
        env: { URL: '${{ secrets.SUPABASE_URL }}', KEY: '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' }
        run: |
          mkdir out
          for t in clients profiles posts comments key_dates client_settings hashtag_sets ideas activity_log post_history post_media; do
            curl -fsS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Range-Unit: items" -H "Range: 0-49999" "$URL/rest/v1/$t?select=*" -o "out/$t.json" || echo "skipped $t"
          done
          tar czf backup.tgz out
      - name: Encrypt
        env: { PASS: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o backup.tgz.gpg backup.tgz
      - uses: actions/upload-artifact@v4
        with: { name: 'backup-${{ github.run_id }}', path: backup.tgz.gpg, retention-days: 90 }
